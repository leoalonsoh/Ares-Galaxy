<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ares Galaxy 2026 — Archivo vivo de descubrimiento musical</title>
<style>
/* ===== ARES GALAXY 2026 — DESIGN SYSTEM =====
   Tokens
   --void        #050308  base background, deep space
   --panel       #0D0A16  raised surface
   --panel-2     #14101F  raised surface, lighter
   --line        #221C33  hairline borders
   --violet      #7B5CFA  cosmic violet — primary
   --violet-dim  #4A3894
   --magenta     #FF3DBE  electric magenta — accent / action
   --blue        #3D7BFF  space blue — links / info
   --amber       #F5A623  archive amber — memory / warmth
   --white       #F5F3FF  luminous white — text primary
   --mute        #9C93B8  text secondary
   --mute-2      #665F80  text tertiary
   Type
   --display: 'Space Grotesk' — headlines, nav, numerics
   --body:    'Inter' — paragraph / UI text
   --mono:    'JetBrains Mono' — tags, file-labels, data, timestamps
*/

@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --void:#050308; --panel:#0D0A16; --panel-2:#14101F; --panel-3:#1B1530;
  --line:#221C33; --line-soft:#1a1526;
  --violet:#7B5CFA; --violet-dim:#4A3894; --violet-glow: rgba(123,92,250,.35);
  --magenta:#FF3DBE; --magenta-glow: rgba(255,61,190,.35);
  --blue:#3D7BFF; --blue-glow: rgba(61,123,255,.35);
  --amber:#F5A623; --amber-glow: rgba(245,166,35,.3);
  --white:#F5F3FF; --mute:#ACA3C8; --mute-2:#8981AB;
  --radius-s:10px; --radius-m:16px; --radius-l:24px;
  --shadow-pop: 0 20px 60px rgba(0,0,0,.55);
  color-scheme: dark;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
svg{display:inline-block; vertical-align:-3px; flex:none;}
.link-more svg{width:12px; height:12px;}
.drawer-close svg{width:14px; height:14px;}
.page-sub svg{width:11px; height:11px;}
body{
  background:
    radial-gradient(1100px 700px at 12% -10%, rgba(123,92,250,.16), transparent 60%),
    radial-gradient(900px 600px at 100% 0%, rgba(255,61,190,.10), transparent 55%),
    radial-gradient(1200px 900px at 50% 120%, rgba(61,123,255,.10), transparent 60%),
    var(--void);
  color:var(--white);
  font-family:'Inter',sans-serif;
  overflow-x:hidden;
  min-height:100vh;
}
body::before{
  content:'';
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.5) 0, transparent 60%),
    radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,.35) 0, transparent 60%),
    radial-gradient(1.5px 1.5px at 70% 15%, rgba(255,255,255,.4) 0, transparent 60%),
    radial-gradient(1px 1px at 85% 60%, rgba(255,255,255,.3) 0, transparent 60%),
    radial-gradient(1px 1px at 55% 85%, rgba(255,255,255,.3) 0, transparent 60%),
    radial-gradient(1.5px 1.5px at 95% 90%, rgba(255,255,255,.35) 0, transparent 60%),
    radial-gradient(1px 1px at 20% 45%, rgba(255,255,255,.25) 0, transparent 60%);
  background-repeat:no-repeat;
  opacity:.6;
}
h1,h2,h3,h4,.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--violet); color:#fff;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
:focus-visible{outline:2px solid var(--magenta); outline-offset:2px; border-radius:4px;}
.hidden{display:none !important;}

/* ===== APP SHELL ===== */
#app{position:relative; z-index:1; min-height:100vh; display:flex;}
#shell{display:flex; width:100%; min-height:100vh;}

/* Sidebar */
.sidebar{
  width:236px; flex:none; min-height:100vh; position:sticky; top:0;
  background:rgba(13,10,22,.6); backdrop-filter:blur(20px);
  border-right:1px solid var(--line-soft);
  display:flex; flex-direction:column; padding:22px 14px;
  z-index:40;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 10px 26px;}
.brand-mark{
  width:32px; height:32px; border-radius:50%;
  background:conic-gradient(from 200deg, var(--violet), var(--magenta), var(--blue), var(--violet));
  box-shadow:0 0 22px var(--violet-glow);
  position:relative; flex:none;
  animation:spin-slow 14s linear infinite;
}
.brand-mark::after{content:''; position:absolute; inset:9px; border-radius:50%; background:var(--void);}
@keyframes spin-slow{to{transform:rotate(360deg);}}
.brand-word{font-family:'Space Grotesk'; font-weight:700; font-size:15.5px; letter-spacing:.02em; line-height:1.1;}
.brand-word span{display:block; font-family:'JetBrains Mono'; font-weight:400; font-size:10px; color:var(--mute-2); letter-spacing:.14em; margin-top:2px;}

.nav-group{display:flex; flex-direction:column; gap:2px; margin-bottom:18px;}
.nav-label{font-family:'JetBrains Mono'; font-size:10px; letter-spacing:.14em; color:var(--mute-2); padding:14px 12px 6px;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:12px;
  color:var(--mute); font-size:13.5px; font-weight:500; position:relative;
  transition:background .15s, color .15s;
}
.nav-item svg{width:18px; height:18px; flex:none; opacity:.85;}
.nav-item:hover{background:var(--panel-2); color:var(--white);}
.nav-item.active{background:linear-gradient(90deg, rgba(123,92,250,.22), rgba(255,61,190,.06)); color:var(--white);}
.nav-item.active::before{content:''; position:absolute; left:-14px; top:8px; bottom:8px; width:3px; border-radius:3px; background:linear-gradient(var(--violet),var(--magenta));}
.nav-item .badge{margin-left:auto; font-family:'JetBrains Mono'; font-size:9.5px; background:var(--panel-3); color:var(--mute); padding:2px 6px; border-radius:20px;}

.sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--line-soft);}
.user-chip{display:flex; align-items:center; gap:10px; padding:8px; border-radius:12px; transition:background .15s;}
.user-chip:hover{background:var(--panel-2);}
.avatar{
  width:34px; height:34px; border-radius:50%; flex:none;
  display:flex; align-items:center; justify-content:center;
  font-family:'Space Grotesk'; font-weight:700; font-size:13px; color:#fff;
  background:linear-gradient(135deg,var(--violet),var(--magenta));
}
.user-chip-meta{line-height:1.25;}
.user-chip-meta b{font-size:12.5px; font-weight:600; display:block;}
.user-chip-meta small{font-size:10.5px; color:var(--mute-2); font-family:'JetBrains Mono';}

/* Main column */
.main-col{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:14px;
  padding:16px 30px; background:rgba(5,3,8,.55); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line-soft);
}
.search-box{
  flex:1; max-width:420px; display:flex; align-items:center; gap:9px;
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:9px 13px; color:var(--mute);
}
.search-box svg{width:15px; height:15px; flex:none; opacity:.7;}
.search-box input{background:none; border:none; color:var(--white); font-size:13px; width:100%; outline:none;}
.search-box input::placeholder{color:var(--mute-2);}
.topbar-actions{margin-left:auto; display:flex; align-items:center; gap:10px;}
.icon-btn{
  width:36px; height:36px; border-radius:11px; background:var(--panel);
  border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
  color:var(--mute); transition:.15s;
}
.icon-btn:hover{color:var(--white); border-color:var(--violet);}
.icon-btn svg{width:16px; height:16px;}
.pill-btn{
  display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:30px;
  background:linear-gradient(90deg,var(--violet),var(--magenta)); color:#fff; font-weight:600; font-size:12.5px;
  border:none; box-shadow:0 10px 26px rgba(123,92,250,.28); transition:transform .15s, box-shadow .15s;
}
.pill-btn:hover{transform:translateY(-1px); box-shadow:0 14px 30px rgba(255,61,190,.35);}
.pill-btn.ghost{background:var(--panel); color:var(--white); border:1px solid var(--line); box-shadow:none;}
.pill-btn.ghost:hover{border-color:var(--violet);}
.pill-btn svg{width:14px; height:14px;}

main{flex:1; padding:26px 30px 90px;}
.view-enter{animation:viewfade .35s ease both;}
@keyframes viewfade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* Page header */
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:22px; flex-wrap:wrap;}
.page-eyebrow{font-family:'JetBrains Mono'; font-size:11px; letter-spacing:.16em; color:var(--magenta); margin-bottom:8px; display:block;}
.page-title{font-size:28px; font-weight:700; letter-spacing:-.01em;}
.page-sub{color:var(--mute); font-size:13.5px; margin-top:6px; max-width:560px; line-height:1.5;}

/* Cards */
.panel{background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--radius-m); }
.panel-pad{padding:20px;}
.section-title{font-family:'Space Grotesk'; font-weight:600; font-size:15px; display:flex; align-items:center; gap:8px;}
.section-title .dot{width:6px; height:6px; border-radius:50%; background:var(--magenta); box-shadow:0 0 8px var(--magenta);}
.link-more{font-family:'JetBrains Mono'; font-size:11px; color:var(--mute); display:flex; align-items:center; gap:5px; transition:color .15s;}
.link-more:hover{color:var(--white);}

.grid{display:grid; gap:16px;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}

/* Song card */
.song-card{
  background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--radius-m);
  padding:12px; position:relative; overflow:hidden; transition:transform .18s, border-color .18s, box-shadow .18s;
}
.song-card:hover{transform:translateY(-3px); border-color:var(--violet); box-shadow:0 16px 34px rgba(0,0,0,.4);}
.song-art{
  width:100%; aspect-ratio:1; border-radius:12px; margin-bottom:12px; position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.song-art .play-ring{
  width:38px; height:38px; border-radius:50%; background:rgba(5,3,8,.55); backdrop-filter:blur(4px);
  border:1px solid rgba(255,255,255,.3); display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .18s, transform .18s; transform:scale(.8);
}
.song-card:hover .play-ring{opacity:1; transform:scale(1);}
.song-art .play-ring svg{width:13px; height:13px; fill:#fff;}
.song-title{font-weight:600; font-size:13.5px; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.song-artist{font-size:11.5px; color:var(--mute); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.song-meta-row{display:flex; align-items:center; justify-content:space-between; margin-top:10px;}
.chip{
  font-family:'JetBrains Mono'; font-size:9.5px; letter-spacing:.03em; color:var(--mute);
  background:var(--panel-3); border:1px solid var(--line); padding:3px 8px; border-radius:20px;
  display:inline-flex; align-items:center; gap:4px;
}
.chip.on{color:var(--white); border-color:var(--violet); background:rgba(123,92,250,.15);}
.mini-btn{
  width:28px; height:28px; border-radius:9px; background:var(--panel-3); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; color:var(--mute); transition:.15s;
}
.mini-btn svg{width:13px; height:13px;}
.mini-btn:hover{color:var(--white); border-color:var(--violet);}
.mini-btn.saved{color:var(--amber); border-color:var(--amber);}

/* artwork gradient palette classes cycling */
.art-1{background:linear-gradient(135deg,#7B5CFA,#2A1B5C);}
.art-2{background:linear-gradient(135deg,#FF3DBE,#5C1B45);}
.art-3{background:linear-gradient(135deg,#3D7BFF,#0F1E4A);}
.art-4{background:linear-gradient(135deg,#F5A623,#5C3A0A);}
.art-5{background:linear-gradient(135deg,#7B5CFA,#FF3DBE);}
.art-6{background:linear-gradient(135deg,#3D7BFF,#7B5CFA);}
.art-7{background:linear-gradient(135deg,#F5A623,#FF3DBE);}
.art-8{background:linear-gradient(135deg,#1B1530,#3D7BFF);}

/* Buttons small */
.btn-line{
  font-size:11.5px; font-family:'JetBrains Mono'; padding:7px 12px; border-radius:9px;
  border:1px solid var(--line); background:transparent; color:var(--mute); transition:.15s;
}
.btn-line:hover{color:var(--white); border-color:var(--violet);}
.btn-line.active{color:#fff; border-color:var(--violet); background:rgba(123,92,250,.18);}

/* Tabs */
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px;}
.tab{
  font-family:'JetBrains Mono'; font-size:11.5px; padding:8px 14px; border-radius:30px;
  border:1px solid var(--line); color:var(--mute); background:var(--panel); transition:.15s;
}
.tab:hover{color:var(--white);}
.tab.active{background:linear-gradient(90deg,var(--violet),var(--magenta)); color:#fff; border-color:transparent;}

/* Friend activity row */
.activity-row{display:flex; gap:12px; align-items:center; padding:11px 4px; border-bottom:1px solid var(--line-soft);}
.activity-row:last-child{border-bottom:none;}
.activity-text{font-size:12.5px; color:var(--mute); line-height:1.4;}
.activity-text b{color:var(--white); font-weight:600;}
.activity-time{margin-left:auto; font-family:'JetBrains Mono'; font-size:10px; color:var(--mute-2); flex:none;}

/* Community card */
.comm-card{
  border-radius:var(--radius-m); border:1px solid var(--line-soft); overflow:hidden; position:relative;
  transition:transform .18s, border-color .18s;
}
.comm-card:hover{transform:translateY(-3px); border-color:var(--violet);}
.comm-cover{height:96px; position:relative;}
.comm-cover::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg, transparent 30%, rgba(13,10,22,.9));}
.comm-body{background:var(--panel); padding:14px 16px 16px; margin-top:-4px;}
.comm-name{font-family:'Space Grotesk'; font-weight:600; font-size:14.5px;}
.comm-desc{font-size:11.5px; color:var(--mute); margin:6px 0 12px; line-height:1.5;}
.comm-stats{display:flex; align-items:center; gap:14px; font-family:'JetBrains Mono'; font-size:10.5px; color:var(--mute-2);}
.avatars-stack{display:flex; align-items:center;}
.avatars-stack .avatar{width:22px; height:22px; font-size:9px; border:2px solid var(--panel); margin-left:-7px;}
.avatars-stack .avatar:first-child{margin-left:0;}

/* File-window (early internet folder motif) */
.file-window{border:1px solid var(--line-soft); border-radius:14px; background:var(--panel); overflow:hidden;}
.file-titlebar{
  display:flex; align-items:center; gap:8px; padding:9px 12px; background:var(--panel-2);
  border-bottom:1px solid var(--line-soft); font-family:'JetBrains Mono'; font-size:10.5px; color:var(--mute);
}
.file-dots{display:flex; gap:5px;}
.file-dots span{width:8px; height:8px; border-radius:50%; display:block;}
.file-dots span:nth-child(1){background:#FF5F57;}
.file-dots span:nth-child(2){background:#FEBC2E;}
.file-dots span:nth-child(3){background:#28C840;}

/* Memory card */
.memory-card{
  background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--radius-m); overflow:hidden;
  transition:transform .18s, border-color .18s;
}
.memory-card:hover{transform:translateY(-3px); border-color:var(--amber);}
.memory-photo{height:140px; position:relative; display:flex; align-items:flex-end; padding:12px;}
.memory-photo::before{content:''; position:absolute; inset:0; background:linear-gradient(180deg, transparent 20%, rgba(5,3,8,.85));}
.memory-date{position:relative; z-index:1; font-family:'JetBrains Mono'; font-size:10px; color:var(--white); background:rgba(5,3,8,.5); padding:3px 8px; border-radius:20px; backdrop-filter:blur(4px);}
.memory-body{padding:14px 16px 16px;}
.memory-note{font-size:12.5px; color:var(--mute); line-height:1.55; margin:8px 0 12px; font-style:italic;}
.memory-tags{display:flex; gap:6px; flex-wrap:wrap;}

/* Empty state */
.empty-state{text-align:center; padding:60px 20px; color:var(--mute);}
.empty-state svg{width:38px; height:38px; margin-bottom:14px; opacity:.5;}
.empty-state h4{color:var(--white); font-family:'Space Grotesk'; margin-bottom:6px; font-size:15px;}
.empty-state p{font-size:12.5px; max-width:320px; margin:0 auto;}

/* Galaxy canvas */
.galaxy-wrap{position:relative; border-radius:var(--radius-l); overflow:hidden; border:1px solid var(--line-soft); background:radial-gradient(ellipse at 50% 40%, rgba(123,92,250,.14), transparent 60%), var(--panel);}
.galaxy-wrap canvas{display:block; width:100%; cursor:grab;}
.galaxy-wrap canvas:active{cursor:grabbing;}
.galaxy-hint{position:absolute; left:18px; bottom:16px; font-family:'JetBrains Mono'; font-size:10.5px; color:var(--mute); background:rgba(5,3,8,.55); backdrop-filter:blur(6px); padding:7px 11px; border-radius:20px; border:1px solid var(--line-soft);}
.galaxy-legend{position:absolute; right:18px; top:16px; display:flex; flex-direction:column; gap:7px; font-family:'JetBrains Mono'; font-size:10px; color:var(--mute); background:rgba(5,3,8,.55); backdrop-filter:blur(6px); padding:10px 12px; border-radius:14px; border:1px solid var(--line-soft);}
.galaxy-legend div{display:flex; align-items:center; gap:7px;}
.legend-dot{width:8px; height:8px; border-radius:50%; flex:none;}

/* Node detail drawer */
.drawer-overlay{position:fixed; inset:0; background:rgba(5,3,8,.65); backdrop-filter:blur(3px); z-index:100; display:flex; justify-content:flex-end;}
.drawer{width:min(420px,92vw); height:100%; background:var(--panel); border-left:1px solid var(--line-soft); overflow-y:auto; animation:drawer-in .28s cubic-bezier(.2,.8,.2,1) both;}
@keyframes drawer-in{from{transform:translateX(30px); opacity:0;} to{transform:translateX(0); opacity:1;}}
.drawer-head{padding:20px; border-bottom:1px solid var(--line-soft); display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
.drawer-close{width:30px; height:30px; border-radius:9px; background:var(--panel-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex:none;}
.drawer-body{padding:20px;}

/* Modal */
.modal-overlay{position:fixed; inset:0; background:rgba(5,3,8,.7); backdrop-filter:blur(4px); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal{width:min(560px,100%); max-height:88vh; overflow-y:auto; background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--radius-l); box-shadow:var(--shadow-pop); animation:modal-in .25s cubic-bezier(.2,.8,.2,1) both;}
@keyframes modal-in{from{transform:scale(.94) translateY(10px); opacity:0;} to{transform:scale(1) translateY(0); opacity:1;}}
.modal-head{padding:22px 24px 0;}
.modal-body{padding:20px 24px 24px;}
.field{margin-bottom:14px;}
.field label{display:block; font-family:'JetBrains Mono'; font-size:10.5px; letter-spacing:.06em; color:var(--mute); margin-bottom:7px;}
.field input, .field textarea, .field select{
  width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px;
  color:var(--white); font-family:'Inter'; font-size:13px; outline:none; transition:border-color .15s;
  color-scheme: dark;
}
.field select{
  -webkit-appearance:none; appearance:none;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%239C93B8" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>');
  background-repeat:no-repeat; background-position:right 12px center; background-size:14px; padding-right:34px;
}
.field select option{ background:#14101F; color:#F5F3FF; }
.field input[type="date"]::-webkit-calendar-picker-indicator{ filter:invert(1); opacity:.75; cursor:pointer; }
.field input:focus, .field textarea:focus{border-color:var(--violet);}
.field textarea{resize:vertical; min-height:70px;}
.field-row{display:flex; gap:12px;}
.field-row .field{flex:1;}
.tag-picker{display:flex; flex-wrap:wrap; gap:7px;}
.tag-opt{font-family:'JetBrains Mono'; font-size:11px; padding:6px 12px; border-radius:20px; border:1px solid var(--line); color:var(--mute); background:var(--panel-2); transition:.15s;}
.tag-opt.on{color:#fff; background:linear-gradient(90deg,var(--violet),var(--magenta)); border-color:transparent;}
.upload-box{border:1.5px dashed var(--line); border-radius:12px; padding:22px; text-align:center; color:var(--mute-2); font-size:11.5px; transition:.15s;}
.upload-box:hover{border-color:var(--violet); color:var(--mute);}
.upload-box svg{width:22px; height:22px; margin-bottom:8px; opacity:.6;}

/* Onboarding */
.onb-overlay{position:fixed; inset:0; background:var(--void); z-index:500; overflow-y:auto;}
.onb-wrap{max-width:640px; margin:0 auto; padding:60px 24px 100px; min-height:100%; display:flex; flex-direction:column;}
.onb-progress{display:flex; gap:6px; margin-bottom:44px;}
.onb-progress i{flex:1; height:3px; border-radius:3px; background:var(--line);}
.onb-progress i.done{background:linear-gradient(90deg,var(--violet),var(--magenta));}
.onb-step{flex:1; animation:viewfade .4s ease both;}
.onb-eyebrow{font-family:'JetBrains Mono'; font-size:11px; letter-spacing:.16em; color:var(--magenta); margin-bottom:14px;}
.onb-title{font-size:30px; font-weight:700; letter-spacing:-.01em; margin-bottom:10px; line-height:1.15;}
.onb-sub{color:var(--mute); font-size:14px; line-height:1.6; margin-bottom:34px; max-width:480px;}
.onb-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px;}
.pick-card{
  border:1px solid var(--line); border-radius:14px; padding:16px 14px; background:var(--panel);
  text-align:center; transition:.15s; position:relative;
}
.pick-card:hover{border-color:var(--violet);}
.pick-card.on{border-color:var(--magenta); background:linear-gradient(180deg, rgba(255,61,190,.1), rgba(123,92,250,.06));}
.pick-card.on::after{content:'✓'; position:absolute; top:8px; right:10px; color:var(--magenta); font-weight:700; font-size:12px;}
.pick-avatar{width:46px; height:46px; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk'; font-weight:700; font-size:15px; color:#fff;}
.pick-card b{font-size:12px; font-weight:600; display:block;}
.pick-card small{font-size:10px; color:var(--mute-2); font-family:'JetBrains Mono';}
.onb-foot{margin-top:auto; padding-top:32px; display:flex; align-items:center; justify-content:space-between; gap:14px;}
.onb-skip{font-family:'JetBrains Mono'; font-size:11.5px; color:var(--mute-2);}
.onb-count{font-family:'JetBrains Mono'; font-size:10.5px; color:var(--mute-2);}

.generating{display:flex; flex-direction:column; align-items:center; text-align:center; padding:40px 0;}
.gen-ring{width:120px; height:120px; border-radius:50%; position:relative; margin-bottom:28px;}
.gen-ring::before, .gen-ring::after{content:''; position:absolute; inset:0; border-radius:50%; border:2px solid transparent;}
.gen-ring::before{border-top-color:var(--violet); border-right-color:var(--magenta); animation:spin-slow 2.2s linear infinite;}
.gen-ring::after{inset:14px; border-bottom-color:var(--blue); border-left-color:var(--violet); animation:spin-slow 3.4s linear infinite reverse;}
.gen-line{font-family:'JetBrains Mono'; font-size:12px; color:var(--mute); margin-top:8px;}

/* AI Curator chat */
.chat-wrap{display:flex; flex-direction:column; height:calc(100vh - 190px); min-height:460px;}
.chat-log{flex:1; overflow-y:auto; padding:6px 4px 20px; display:flex; flex-direction:column; gap:14px;}
.msg{max-width:74%; padding:12px 15px; border-radius:16px; font-size:13.5px; line-height:1.55; animation:viewfade .3s ease both;}
.msg.user{align-self:flex-end; background:linear-gradient(135deg,var(--violet),var(--magenta)); color:#fff; border-bottom-right-radius:4px;}
.msg.ai{align-self:flex-start; background:var(--panel-2); border:1px solid var(--line-soft); border-bottom-left-radius:4px;}
.msg.ai .ai-tag{font-family:'JetBrains Mono'; font-size:9.5px; color:var(--violet); letter-spacing:.1em; margin-bottom:6px; display:block;}
.typing-dots{display:flex; gap:4px; padding:6px 3px;}
.typing-dots span{width:6px; height:6px; border-radius:50%; background:var(--mute); animation:blink 1.2s infinite ease-in-out;}
.typing-dots span:nth-child(2){animation-delay:.2s;} .typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}
.chat-suggestions{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.chat-input-bar{display:flex; gap:10px; align-items:center; padding:10px; background:var(--panel); border:1px solid var(--line-soft); border-radius:16px;}
.chat-input-bar input{flex:1; background:none; border:none; outline:none; color:var(--white); font-size:13.5px; padding:6px 8px;}
.chat-song-result{display:flex; align-items:center; gap:10px; background:var(--panel-3); border:1px solid var(--line); border-radius:12px; padding:8px; margin-top:8px;}
.chat-song-result .mini-art{width:36px; height:36px; border-radius:8px; flex:none;}
.chat-song-result .csr-meta{flex:1; min-width:0;}
.chat-song-result .csr-meta b{font-size:12px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.chat-song-result .csr-meta span{font-size:10.5px; color:var(--mute);}

/* Mini player (generative preview clips) */
#mini-player-root{position:fixed; left:0; right:0; bottom:0; z-index:80; display:flex; justify-content:center; pointer-events:none;}
.mini-player{
  pointer-events:auto; width:min(560px, calc(100% - 32px)); margin:0 0 16px;
  background:rgba(13,10,22,.82); backdrop-filter:blur(20px); border:1px solid var(--line-soft);
  border-radius:18px; box-shadow:var(--shadow-pop); overflow:hidden; animation:mp-in .3s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes mp-in{from{transform:translateY(16px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.mini-player-top{display:flex; align-items:center; gap:12px; padding:11px 14px;}
.mini-player-art{width:38px; height:38px; border-radius:9px; flex:none; position:relative; overflow:hidden;}
.mini-player-meta{flex:1; min-width:0;}
.mini-player-meta b{font-size:12.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.mini-player-meta span{font-size:10.5px; color:var(--mute); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.eq-bars{display:flex; align-items:flex-end; gap:2.5px; height:16px; flex:none;}
.eq-bars i{width:3px; border-radius:2px; background:linear-gradient(180deg,var(--magenta),var(--violet)); display:block; animation:eq 0.85s ease-in-out infinite;}
.eq-bars i:nth-child(1){animation-delay:-0.6s;} .eq-bars i:nth-child(2){animation-delay:-0.3s;} .eq-bars i:nth-child(3){animation-delay:-0.75s;} .eq-bars i:nth-child(4){animation-delay:-0.15s;}
@keyframes eq{0%,100%{height:4px;} 50%{height:16px;}}
.mini-player-stop{width:30px; height:30px; border-radius:50%; background:var(--panel-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex:none; color:var(--white); transition:.15s;}
.mini-player-stop:hover{border-color:var(--magenta); color:var(--magenta);}
.mini-player-stop svg{width:12px; height:12px;}
.mini-player-progress{height:3px; background:var(--line-soft); position:relative;}
.mini-player-progress-fill{position:absolute; inset:0; width:0%; background:linear-gradient(90deg,var(--violet),var(--magenta)); transition:width .1s linear;}
.mini-player-note{font-family:'JetBrains Mono'; font-size:9px; color:var(--mute-2); padding:0 14px 9px; letter-spacing:.04em;}
@media (max-width: 860px){ #mini-player-root{bottom:64px;} }

/* Play/pause button on song art */
.play-ring{transition:opacity .18s, transform .18s, box-shadow .2s;}
.play-ring.is-playing{opacity:1 !important; transform:scale(1) !important; box-shadow:0 0 0 3px rgba(255,61,190,.28);}
.play-ring svg.icon-pause{fill:#fff;}
.song-card.is-playing{border-color:var(--magenta); box-shadow:0 0 0 1px rgba(255,61,190,.3), 0 16px 34px rgba(0,0,0,.4);}
.toast-stack{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:999; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{
  font-family:'JetBrains Mono'; font-size:12px; color:var(--white); background:var(--panel-2);
  border:1px solid var(--violet); padding:11px 18px; border-radius:30px; box-shadow:var(--shadow-pop);
  display:flex; align-items:center; gap:9px; animation:toast-in .25s ease both;
}
@keyframes toast-in{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.toast .dot{width:6px; height:6px; border-radius:50%; background:var(--magenta); box-shadow:0 0 8px var(--magenta);}

/* Bottom mobile nav */
.bottom-nav{display:none;}

/* Events */
.event-card{display:flex; gap:16px; background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--radius-m); padding:16px; align-items:center;}
.event-date-block{width:56px; height:56px; border-radius:14px; flex:none; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--panel-3); border:1px solid var(--line);}
.event-date-block b{font-family:'Space Grotesk'; font-size:18px; line-height:1;}
.event-date-block span{font-family:'JetBrains Mono'; font-size:9px; color:var(--mute); text-transform:uppercase;}
.event-info{flex:1; min-width:0;}
.event-info h4{font-family:'Space Grotesk'; font-size:14.5px; margin-bottom:4px;}
.event-info p{font-size:11.5px; color:var(--mute);}

/* Profile */
.profile-hero{display:flex; gap:22px; align-items:center; padding:26px; margin-bottom:20px;}
.profile-avatar{width:84px; height:84px; border-radius:50%; flex:none; font-size:28px;}
.stat-block{text-align:center;}
.stat-block b{font-family:'Space Grotesk'; font-size:20px; display:block;}
.stat-block span{font-family:'JetBrains Mono'; font-size:10px; color:var(--mute-2);}

/* Responsive */
@media (max-width: 1080px){

}
@media (max-width: 860px){
  .sidebar{display:none;}
  .g4,.g3{grid-template-columns:repeat(2,1fr);}
  .g2{grid-template-columns:1fr;}
  main{padding:18px 16px 100px;}
  .topbar{padding:14px 16px;}
  .bottom-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; z-index:60;
    background:rgba(13,10,22,.9); backdrop-filter:blur(16px); border-top:1px solid var(--line-soft);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .bottom-nav a{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 2px; color:var(--mute-2); font-size:9px; font-family:'JetBrains Mono';}
  .bottom-nav a svg{width:18px; height:18px;}
  .bottom-nav a.active{color:var(--white);}
  .onb-grid{grid-template-columns:repeat(2,1fr);}
  .profile-hero{flex-direction:column; text-align:center;}
}
</style>

/* ===== ARES GALAXY — PERSISTENCIA LOCAL =====
   Todo vive en localStorage del navegador. No hay backend ni cuentas reales:
   "iniciar sesión" en este prototipo significa (a) autenticarte de verdad con
   una plataforma musical vía OAuth, o (b) retomar la galaxia que ya construiste
   en este navegador. Esto es necesario además porque el flujo OAuth recarga
   la página al volver, y sin persistencia se perdería todo lo construido.
*/
const LS_KEY = 'aresGalaxy.state.v1';
function persist(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      USER, SONGS, MEMORIES,
      communitiesJoined: COMMUNITIES.map(c=>({id:c.id, joined:c.joined})),
      eventsGoing: EVENTS.map(e=>({id:e.id, going:e.going})),
      onboarded: state.onboarded,
      connections: CONNECTIONS,
      pendingFriends: PENDING_FRIENDS,
      savedAt: Date.now(),
    }));
  }catch(e){ console.warn('No se pudo guardar el estado local de Ares Galaxy', e); }
}
function restore(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(data.USER) Object.assign(USER, data.USER);
    if(Array.isArray(data.SONGS)){ SONGS.length = 0; data.SONGS.forEach(s=>SONGS.push(s)); }
    if(Array.isArray(data.MEMORIES)){ MEMORIES.length = 0; data.MEMORIES.forEach(m=>MEMORIES.push(m)); }
    if(Array.isArray(data.communitiesJoined)) data.communitiesJoined.forEach(c=>{ const m = COMMUNITIES.find(x=>x.id===c.id); if(m) m.joined = c.joined; });
    if(Array.isArray(data.eventsGoing)) data.eventsGoing.forEach(e=>{ const m = EVENTS.find(x=>x.id===e.id); if(m) m.going = e.going; });
    if(data.connections) Object.keys(CONNECTIONS).forEach(k=>{ if(data.connections[k]) Object.assign(CONNECTIONS[k], data.connections[k]); });
    if(Array.isArray(data.pendingFriends)) PENDING_FRIENDS = data.pendingFriends;
    state.onboarded = !!data.onboarded;
    return true;
  }catch(e){ console.warn('No se pudo restaurar el estado local de Ares Galaxy', e); return false; }
}

/* ===== ARES GALAXY — PREVIEW AUDIO ENGINE =====
   Generates short, original, procedurally-composed synth micro-clips per song.
   Nothing here reproduces a real recording — each "preview" is a deterministic
   generative arpeggio derived from the song's id/title, so the same song always
   sounds the same, and different songs sound distinct from each other.
*/

let audioCtx = null;
let current = null; // { songId, ctx, nodes[], startTime, duration, tickHandle }

function ensureCtx(){
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctx();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function hashStr(s){
  let h = 2166136261;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const SCALES = {
  majorPenta: [0,2,4,7,9],
  minorPenta: [0,3,5,7,10],
  dorian: [0,2,3,5,7,9,10],
  mixolydian: [0,2,4,5,7,9,10],
};
const SCALE_NAMES = Object.keys(SCALES);

// 8 timbre presets, cycling with the 8 art-N gradient classes so a song's
// sound and its visual identity stay loosely coherent.
const PRESETS = [
  {wave:'triangle', filter:2200, delay:.16, wet:.18, noteDur:.42, attack:.02},
  {wave:'square',   filter:1400, delay:.12, wet:.12, noteDur:.28, attack:.005},
  {wave:'sine',     filter:3200, delay:.22, wet:.22, noteDur:.50, attack:.04},
  {wave:'triangle', filter:1200, delay:.28, wet:.28, noteDur:.55, attack:.06},
  {wave:'sawtooth', filter:1800, delay:.14, wet:.15, noteDur:.32, attack:.01},
  {wave:'sine',     filter:2600, delay:.20, wet:.20, noteDur:.40, attack:.03},
  {wave:'square',   filter:2000, delay:.18, wet:.16, noteDur:.36, attack:.01},
  {wave:'triangle', filter:1600, delay:.24, wet:.20, noteDur:.46, attack:.03},
];

function buildProfile(song){
  const rnd = mulberry32(hashStr((song.id||'') + '|' + (song.title||'')));
  const scale = SCALES[SCALE_NAMES[Math.floor(rnd()*SCALE_NAMES.length)]];
  const rootMidiOffset = Math.floor(rnd()*10) - 4; // small deterministic range
  const rootFreq = 220 * Math.pow(2, rootMidiOffset/12);
  const artIndex = parseInt((song.art||'art-1').split('-')[1], 10) || 1;
  const preset = PRESETS[(artIndex-1) % PRESETS.length];
  const noteCount = 8 + Math.floor(rnd()*5);
  const degrees = [];
  for(let i=0;i<noteCount;i++) degrees.push(scale[Math.floor(rnd()*scale.length)]);
  degrees.push(degrees[0], degrees[1] !== undefined ? degrees[1] : degrees[0]); // loop-back hook
  return { rootFreq, degrees, preset };
}

function stopPreview(){
  if(!current) return;
  if(current.kind==='spotify'){ spotifyPausePlayback(); }
  else if(current.kind==='youtube'){ youtubePausePlayback(); }
  else {
    const { nodes, tickHandle, timeoutId } = current;
    (nodes||[]).forEach(n=>{
      try{ n.stop && n.stop(); }catch(e){}
      try{ n.disconnect && n.disconnect(); }catch(e){}
    });
    if(tickHandle) cancelAnimationFrame(tickHandle);
    if(timeoutId) clearTimeout(timeoutId);
  }
  stopMediaTicker();
  current = null;
  if(typeof onPreviewChange === 'function') onPreviewChange(null);
}

/* ---------- REPRODUCCIÓN: despachador único =====
   Decide entre audio real (Spotify Web Playback SDK / YouTube IFrame Player)
   y el clip sintético generativo, según de dónde venga la canción y si hay
   una conexión real activa. Si el audio real falla (p.ej. sin Premium), cae
   al clip generativo mostrando siempre un aviso claro de cuál está sonando.
*/
async function playPreview(song){
  if(!song) return;
  if(current && current.songId === song.id){ stopPreview(); return; }
  stopPreview();

  if(song.source==='spotify' && CONNECTIONS.spotify.connected){
    const trackId = song.id.replace(/^sp-/, '');
    current = { songId: song.id, kind:'spotify' };
    if(typeof onPreviewChange === 'function') onPreviewChange({ songId:song.id, song, duration:null, real:true, platformLabel:'Spotify' });
    const ok = await spotifyPlayTrack(trackId);
    if(!ok){ current = null; playSynthPreview(song); return; }
    startMediaTicker(async ()=>{
      if(!spPlayer) return null;
      const st = await spPlayer.getCurrentState();
      if(!st || !st.duration) return null;
      if(st.paused && st.position===0) return null;
      return st.position / st.duration;
    });
    return;
  }
  if(song.source==='youtube' && CONNECTIONS.youtube.connected){
    const videoId = song.id.replace(/^yt-/, '');
    current = { songId: song.id, kind:'youtube' };
    if(typeof onPreviewChange === 'function') onPreviewChange({ songId:song.id, song, duration:null, real:true, platformLabel:'YouTube' });
    try{
      await youtubePlayVideo(videoId);
      startMediaTicker(()=>{
        if(!ytPlayer || typeof ytPlayer.getDuration!=='function') return null;
        const dur = ytPlayer.getDuration();
        if(!dur) return null;
        return ytPlayer.getCurrentTime() / dur;
      });
    }catch(e){
      console.error(e);
      toast('No se pudo reproducir ese video de YouTube');
      current = null; playSynthPreview(song);
    }
    return;
  }
  playSynthPreview(song);
}

let mediaTicker = null;
function startMediaTicker(getProgress){
  stopMediaTicker();
  mediaTicker = setInterval(async ()=>{
    if(!current){ stopMediaTicker(); return; }
    const p = await getProgress();
    if(p==null) return;
    if(typeof onPreviewProgress === 'function') onPreviewProgress(Math.max(0, Math.min(1, p)));
    if(p >= 0.995) stopPreview();
  }, 400);
}
function stopMediaTicker(){ if(mediaTicker){ clearInterval(mediaTicker); mediaTicker=null; } }

function playSynthPreview(song){
  if(!song) return;
  const ctx = ensureCtx();

  const profile = buildProfile(song);
  const now = ctx.currentTime + 0.04;

  const masterGain = ctx.createGain(); masterGain.gain.value = 0;
  const filter = ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value = profile.preset.filter; filter.Q.value = 0.7;
  const delay = ctx.createDelay(1.0); delay.delayTime.value = profile.preset.delay;
  const feedback = ctx.createGain(); feedback.gain.value = 0.28;
  const wet = ctx.createGain(); wet.gain.value = profile.preset.wet;

  filter.connect(masterGain);
  filter.connect(delay);
  delay.connect(feedback); feedback.connect(delay);
  delay.connect(wet);
  masterGain.connect(ctx.destination);
  wet.connect(ctx.destination);

  masterGain.gain.setValueAtTime(0, now);
  masterGain.gain.linearRampToValueAtTime(0.22, now + 0.08);

  const nodes = [masterGain, filter, delay, feedback, wet];
  let t = now;
  profile.degrees.forEach(deg=>{
    const freq = profile.rootFreq * Math.pow(2, deg/12);
    const osc = ctx.createOscillator(); osc.type = profile.preset.wave; osc.frequency.value = freq;
    const noteGain = ctx.createGain(); noteGain.gain.value = 0;
    osc.connect(noteGain); noteGain.connect(filter);
    const dur = profile.preset.noteDur;
    noteGain.gain.setValueAtTime(0.0001, t);
    noteGain.gain.linearRampToValueAtTime(0.9, t + profile.preset.attack);
    noteGain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.start(t);
    osc.stop(t + dur + 0.05);
    nodes.push(osc, noteGain);
    t += dur * 0.86;
  });

  const totalDur = (t - now) + 0.3;
  masterGain.gain.setValueAtTime(0.22, now + totalDur - 0.35);
  masterGain.gain.linearRampToValueAtTime(0, now + totalDur - 0.02);

  current = { songId: song.id, kind:'synth', ctx, nodes, startTime: now, duration: totalDur, tickHandle:null, timeoutId:null };
  if(typeof onPreviewChange === 'function') onPreviewChange({ songId: song.id, song, duration: totalDur, real:false });

  function tick(){
    if(!current || current.songId !== song.id) return;
    const elapsed = ctx.currentTime - current.startTime;
    const progress = Math.max(0, Math.min(1, elapsed / current.duration));
    if(typeof onPreviewProgress === 'function') onPreviewProgress(progress);
    if(progress >= 1){ stopPreview(); return; }
    current.tickHandle = requestAnimationFrame(tick);
  }
  current.tickHandle = requestAnimationFrame(tick);
  current.timeoutId = setTimeout(()=>{ if(current && current.songId===song.id) stopPreview(); }, (totalDur+0.25)*1000);
}

/* ===== ARES GALAXY — GALAXY VISUALIZATION (signature element) =====
   Builds a graph of: me -> songs -> (era/tag, place, person) satellites, and me -> joined communities.
   Rendered on <canvas> as a slowly rotating, draggable node-link "galaxy".
*/

const GOLDEN_ANGLE = 2.399963229728653;

function buildGalaxyGraph(){
  const nodes = {};
  const edgeSet = new Set();
  const edges = [];
  function addEdge(a,b){
    const k = a+'>>'+b;
    if(edgeSet.has(k)) return;
    edgeSet.add(k);
    edges.push({a,b});
  }
  nodes['me'] = { id:'me', type:'me', label:(USER.name||'Tú').split(' ')[0], ring:0 };

  const mainSongIds = [...new Set(MEMORIES.map(m=>m.songId))];

  mainSongIds.forEach(sid=>{
    const song = findSong(sid);
    nodes['song-'+sid] = { id:'song-'+sid, type:'song', label:song?song.title:sid, songId:sid, ring:1 };
    addEdge('me','song-'+sid);
  });

  MEMORIES.forEach(m=>{
    const songNodeId = 'song-'+m.songId;
    const satellites = [];
    (m.tags||[]).forEach(t=> satellites.push(['tag', t]));
    if(m.place) satellites.push(['place', m.place]);
    (m.people||[]).forEach(p=>{ if(p && p.toLowerCase()!=='yo') satellites.push(['person', p]); });

    satellites.forEach(([type,label])=>{
      const key = type+'|'+label.toLowerCase();
      if(!nodes[key]) nodes[key] = { id:key, type, label, ring:2, songIds:[] };
      if(!nodes[key].songIds.includes(m.songId)) nodes[key].songIds.push(m.songId);
      addEdge(songNodeId, key);
    });
  });

  // saved songs without a memory yet — simple satellites of "me"
  SONGS.filter(s=>s.saved && !mainSongIds.includes(s.id)).forEach(s=>{
    nodes['song-'+s.id] = { id:'song-'+s.id, type:'song', label:s.title, songId:s.id, ring:1, minor:true };
    addEdge('me','song-'+s.id);
  });

  // joined communities
  COMMUNITIES.filter(c=>c.joined).forEach(c=>{
    nodes['comm-'+c.id] = { id:'comm-'+c.id, type:'community', label:c.name, commId:c.id, ring:1 };
    addEdge('me','comm-'+c.id);
  });

  // degree
  const degree = {};
  edges.forEach(e=>{ degree[e.a]=(degree[e.a]||0)+1; degree[e.b]=(degree[e.b]||0)+1; });
  Object.values(nodes).forEach(n=> n.degree = degree[n.id]||0);

  // assign angles per ring group, golden-angle distributed, deterministic
  const ringGroups = {1:[], 2:[]};
  Object.values(nodes).forEach(n=>{ if(ringGroups[n.ring]) ringGroups[n.ring].push(n); });
  Object.keys(ringGroups).forEach(r=>{
    ringGroups[r].sort((a,b)=> a.id.localeCompare(b.id));
    ringGroups[r].forEach((n,i)=>{ n.angle = (i*GOLDEN_ANGLE) % (Math.PI*2); n.wobble = (i%7)*0.9; });
  });

  return { nodes: Object.values(nodes), edges };
}

function mountGalaxy(canvasId, opts){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const wrap = canvas.parentElement;
  const ctx = canvas.getContext('2d');
  const interactive = !!opts.interactive;
  const graph = buildGalaxyGraph();
  const filter = interactive ? (state.galaxyFilter || 'all') : 'all';

  let dpr = Math.min(window.devicePixelRatio||1, 2);
  let W=0, H=0;
  let rotation = 0;
  let dragOffset = 0;
  let dragging = false;
  let lastPointerX = 0;
  let hoverId = null;
  let velocity = 0;

  const dust = Array.from({length:70}).map(()=>({
    x:Math.random(), y:Math.random(), r:Math.random()*1.4+.3, phase:Math.random()*Math.PI*2, speed:.0006+Math.random()*.0012
  }));

  function resize(){
    const rect = wrap.getBoundingClientRect();
    W = rect.width; H = rect.height || 480;
    canvas.width = W*dpr; canvas.height = H*dpr;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  const onResize = ()=>resize();
  window.addEventListener('resize', onResize);

  function nodeVisible(n){
    if(filter==='all') return true;
    if(n.type==='me') return true;
    return n.type===filter;
  }

  function layout(t){
    const cx = W/2, cy = H/2 - 6;
    const base = Math.min(W,H);
    const R1 = base*0.26, R2 = base*0.44;
    const rot = rotation + dragOffset;
    graph.nodes.forEach(n=>{
      if(n.type==='me'){ n.wx=0; n.wy=0; }
      else {
        const R = n.ring===1 ? R1 : R2;
        const a = n.angle + rot * (n.ring===1?1:0.62);
        const wob = Math.sin(t*0.0009 + n.wobble)*6;
        n.wx = Math.cos(a) * (R+wob);
        n.wy = Math.sin(a) * (R+wob) * 0.56; // flatten into a disc
      }
      n.sx = cx + n.wx;
      n.sy = cy + n.wy + Math.sin(t*0.0011 + (n.wobble||0))*3;
      n.visible = nodeVisible(n);
      let base_r = n.type==='me' ? Math.min(26, base*0.05) : n.type==='song' ? (n.minor?7:9) + Math.min(n.degree,4)*1.1 : 6 + Math.min(n.degree,5)*1.1;
      n.r = base_r;
    });
  }

  function draw(t){
    ctx.clearRect(0,0,W,H);

    // ambient dust
    dust.forEach(d=>{
      const alpha = 0.25 + Math.sin(t*d.speed + d.phase)*0.2;
      ctx.beginPath();
      ctx.fillStyle = `rgba(245,243,255,${Math.max(0,alpha)*0.5})`;
      ctx.arc(d.x*W, d.y*H, d.r, 0, Math.PI*2);
      ctx.fill();
    });

    const nodeById = {};
    graph.nodes.forEach(n=> nodeById[n.id]=n);

    // edges
    graph.edges.forEach(e=>{
      const a = nodeById[e.a], b = nodeById[e.b];
      if(!a||!b) return;
      if(filter!=='all' && !(a.visible && b.visible)) return;
      const dim = filter!=='all';
      const hovered = hoverId && (e.a===hoverId || e.b===hoverId);
      ctx.beginPath();
      ctx.moveTo(a.sx, a.sy);
      const mx=(a.sx+b.sx)/2 + (b.sy-a.sy)*0.06, my=(a.sy+b.sy)/2 - (b.sx-a.sx)*0.06;
      ctx.quadraticCurveTo(mx,my,b.sx,b.sy);
      ctx.strokeStyle = hovered ? 'rgba(255,61,190,.55)' : 'rgba(123,92,250,.16)';
      ctx.lineWidth = hovered ? 1.6 : 1;
      ctx.stroke();
    });

    // nodes
    graph.nodes.forEach(n=>{
      if(filter!=='all' && !n.visible) return;
      const color = NODE_COLORS[n.type] || '#7B5CFA';
      const isHover = hoverId===n.id;
      const glow = n.type==='me' ? 22 : isHover ? 16 : 8;
      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = glow;
      ctx.beginPath();
      ctx.fillStyle = n.type==='me' ? '#ffffff' : color;
      ctx.globalAlpha = n.minor ? 0.65 : 1;
      ctx.arc(n.sx, n.sy, isHover ? n.r*1.18 : n.r, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
      if(n.type==='community'){
        ctx.beginPath();
        ctx.setLineDash([2,3]);
        ctx.strokeStyle = 'rgba(255,255,255,.55)';
        ctx.lineWidth=1;
        ctx.arc(n.sx, n.sy, n.r+3.5, 0, Math.PI*2);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      // label for me + hover + song(non-minor) at rest for orientation
      const showLabel = n.type==='me' || isHover || (interactive===false && n.type==='song' && !n.minor);
      if(showLabel){
        ctx.font = n.type==='me' ? '600 12px Space Grotesk, sans-serif' : '500 10.5px JetBrains Mono, monospace';
        ctx.fillStyle = isHover ? '#FF3DBE' : 'rgba(245,243,255,.85)';
        ctx.textAlign='center';
        const label = n.label.length>22 ? n.label.slice(0,20)+'…' : n.label;
        ctx.fillText(label, n.sx, n.sy + n.r + 14);
      }
    });
  }

  function frame(t){
    rotation = t*0.00004;
    layout(t);
    draw(t);
    g.raf = requestAnimationFrame(frame);
  }

  function findHover(mx,my){
    let best=null, bestD=999999;
    graph.nodes.forEach(n=>{
      if(filter!=='all' && !n.visible) return;
      const d = Math.hypot(n.sx-mx, n.sy-my);
      if(d < n.r+9 && d<bestD){ bestD=d; best=n; }
    });
    return best;
  }

  function getPos(evt){
    const rect = canvas.getBoundingClientRect();
    return { x: evt.clientX-rect.left, y: evt.clientY-rect.top };
  }

  canvas.addEventListener('pointerdown', (e)=>{
    dragging = true; lastPointerX = e.clientX;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e)=>{
    const p = getPos(e);
    if(dragging && interactive){
      const dx = e.clientX - lastPointerX;
      dragOffset += dx*0.006;
      velocity = dx*0.006;
      lastPointerX = e.clientX;
      canvas.style.cursor='grabbing';
    } else {
      const h = findHover(p.x,p.y);
      hoverId = h ? h.id : null;
      canvas.style.cursor = h ? 'pointer' : (interactive?'grab':'pointer');
    }
  });
  window.addEventListener('pointerup', ()=>{ dragging=false; });
  canvas.addEventListener('pointerleave', ()=>{ if(!dragging){ hoverId=null; } });
  canvas.addEventListener('click', (e)=>{
    const p = getPos(e);
    const h = findHover(p.x,p.y);
    if(!interactive){ if(opts.onClick) opts.onClick(); return; }
    if(h && h.type!=='me'){
      state.drawer = { kind:'node', node: h };
      renderOverlays();
    }
  });

  const g = { raf:null, onResize, canvasEl:canvas };
  activeGalaxies.push(g);
  g.raf = requestAnimationFrame(frame);
}

/* ===== ARES GALAXY — INTEGRACIÓN REAL: SPOTIFY (OAuth 2.0 + PKCE) =====
   Flujo 100% client-side, sin servidor ni client secret (Authorization Code
   con PKCE, el flujo que Spotify recomienda para apps sin backend). Requiere
   que la persona registre su propia app gratuita en developer.spotify.com y
   pegue su Client ID en Conexiones. La Redirect URI debe ser exactamente
   la que muestra esa pantalla (una dirección loopback, ver nota ahí).
*/
function spGetConfig(){
  return JSON.parse(localStorage.getItem('aresGalaxy.spotifyConfig')||'null') || { clientId:'', redirectUri: location.origin + location.pathname };
}
function spSetConfig(cfg){ localStorage.setItem('aresGalaxy.spotifyConfig', JSON.stringify(cfg)); }
function saveSpotifyConfig(){
  const clientId = document.getElementById('sp-clientid').value.trim();
  const cfg = spGetConfig(); cfg.clientId = clientId; spSetConfig(cfg);
  toast('Configuración de Spotify guardada');
}
function pkceRandomString(len){
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return Array.from(arr, b=>('0'+b.toString(16)).slice(-2)).join('').slice(0, len);
}
function base64UrlFromBuffer(buf){
  const bytes = new Uint8Array(buf);
  let str = '';
  for(let i=0;i<bytes.byteLength;i++) str += String.fromCharCode(bytes[i]);
  return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function pkceChallengeFromVerifier(verifier){
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return base64UrlFromBuffer(digest);
}
async function spotifyConnect(){
  const cfg = spGetConfig();
  if(!cfg.clientId){
    toast('Primero configura tu Client ID de Spotify' + (state.onboarded ? '' : ' (crea tu galaxia local y ve a Conexiones)'));
    if(state.onboarded) go('connections');
    return;
  }
  if(!window.isSecureContext && location.hostname!=='127.0.0.1' && location.hostname!=='localhost'){
    toast('Spotify exige http(s) — abre este archivo desde un servidor local, no con doble clic'); return;
  }
  const verifier = pkceRandomString(64);
  const challenge = await pkceChallengeFromVerifier(verifier);
  const stateParam = pkceRandomString(24);
  localStorage.setItem('aresGalaxy.sp.verifier', verifier);
  localStorage.setItem('aresGalaxy.sp.state', stateParam);
  const scope = ['user-read-email','user-read-private','user-top-read','user-read-recently-played','user-library-read','playlist-read-private','user-follow-read','streaming'].join(' ');
  const params = new URLSearchParams({ client_id:cfg.clientId, response_type:'code', redirect_uri:cfg.redirectUri, code_challenge_method:'S256', code_challenge:challenge, state:stateParam, scope });
  window.location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
}
function spSaveTokens(tok){
  const prev = spGetTokens() || {};
  localStorage.setItem('aresGalaxy.sp.tokens', JSON.stringify({
    access_token: tok.access_token,
    refresh_token: tok.refresh_token || prev.refresh_token || null,
    expires_at: Date.now() + (tok.expires_in*1000) - 8000,
  }));
}
function spGetTokens(){ return JSON.parse(localStorage.getItem('aresGalaxy.sp.tokens')||'null'); }
async function spEnsureToken(){
  const t = spGetTokens();
  if(!t) return null;
  if(Date.now() < t.expires_at) return t.access_token;
  if(!t.refresh_token) return null;
  const cfg = spGetConfig();
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({ grant_type:'refresh_token', refresh_token:t.refresh_token, client_id:cfg.clientId })
  });
  if(!res.ok) return null;
  const tok = await res.json();
  spSaveTokens(tok);
  return tok.access_token;
}
async function spFetch(path, params){
  const token = await spEnsureToken();
  if(!token) throw new Error('sin token de Spotify');
  const url = 'https://api.spotify.com/v1'+path + (params ? ('?'+new URLSearchParams(params)) : '');
  const res = await fetch(url, { headers:{ Authorization:'Bearer '+token } });
  if(res.status===429){ toast('Spotify: demasiadas solicitudes, intenta de nuevo en un momento'); throw new Error('rate limited'); }
  if(!res.ok) throw new Error('Spotify API error '+res.status);
  return res.json();
}
async function spotifyHandleCallback(){
  const qs = new URLSearchParams(window.location.search);
  if(!qs.has('code') && !qs.has('error')) return false;
  const returnedState = qs.get('state');
  const savedState = localStorage.getItem('aresGalaxy.sp.state');
  history.replaceState({}, '', window.location.pathname + window.location.hash);
  if(qs.get('error')){ toast('Spotify no autorizó la conexión: '+qs.get('error')); return true; }
  if(!savedState || returnedState !== savedState){ toast('La verificación de la conexión con Spotify falló, intenta de nuevo'); return true; }
  const verifier = localStorage.getItem('aresGalaxy.sp.verifier');
  const cfg = spGetConfig();
  try{
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({ grant_type:'authorization_code', code:qs.get('code'), redirect_uri:cfg.redirectUri, client_id:cfg.clientId, code_verifier:verifier })
    });
    if(!res.ok){ const errBody = await res.text(); throw new Error('token exchange failed '+res.status+': '+errBody); }
    spSaveTokens(await res.json());
    await spotifySync();
  }catch(e){
    console.error(e);
    toast('No se pudo completar la conexión con Spotify. Revisa Client ID y Redirect URI en Conexiones.');
  }
  return true;
}
function artClassFor(seed){ return 'art-' + ((hashStr(String(seed)) % 8) + 1); }
function upsertSong(song){
  const existing = SONGS.find(s=>s.id===song.id);
  if(existing){ Object.assign(existing, song); return existing; }
  SONGS.unshift(song);
  return song;
}
function songFromSpotifyTrack(t, extra){
  if(!t || !t.id) return null;
  return upsertSong(Object.assign({
    id:'sp-'+t.id, title:t.name, artist:(t.artists||[]).map(a=>a.name).join(', '),
    art:artClassFor(t.id), saved:true, tag:null, source:'spotify'
  }, extra||{}));
}
async function spotifySync(){
  try{
    const me = await spFetch('/me');
    let pulled = 0;
    try{ const top = await spFetch('/me/top/tracks', {limit:10, time_range:'medium_term'}); (top.items||[]).forEach(t=>{ songFromSpotifyTrack(t, {tag:'Top Spotify'}); pulled++; }); }catch(e){ console.warn('top tracks', e); }
    try{ const saved = await spFetch('/me/tracks', {limit:20}); (saved.items||[]).forEach(it=>{ songFromSpotifyTrack(it.track); pulled++; }); }catch(e){ console.warn('saved tracks', e); }
    try{ const recent = await spFetch('/me/player/recently-played', {limit:20}); (recent.items||[]).forEach(it=>{ songFromSpotifyTrack(it.track, {tag:'Escuchado recientemente'}); pulled++; }); }catch(e){ console.warn('recently played', e); }
    CONNECTIONS.spotify.connected = true;
    CONNECTIONS.spotify.profile = { name: me.display_name, id: me.id, product: me.product };
    CONNECTIONS.spotify.lastSync = Date.now();
    CONNECTIONS.spotify.counts = { canciones: pulled };
    const firstBoot = !state.onboarded;
    if(firstBoot){
      if(me.display_name){ USER.name = me.display_name; USER.handle = '@'+slugify(me.display_name); }
      state.chat = [{ role:'ai', text:`¡Hola ${USER.name.split(' ')[0]}! Conecté tu cuenta de Spotify y ya empecé a tejer tu galaxia con tu música real.`, songs:[] }];
      state.onboarded = true;
      state.gate = 'app';
    }
    persist();
    toast(`Spotify conectado — ${pulled} canciones sincronizadas`);
    state.route = state.route || 'home';
    location.hash = '#/' + (firstBoot ? 'home' : state.route);
    render();
  }catch(e){
    console.error(e);
    toast('Se conectó Spotify pero hubo un problema trayendo tu música. Intenta sincronizar de nuevo desde Conexiones.');
    render();
  }
}
function spotifyDisconnect(){
  localStorage.removeItem('aresGalaxy.sp.tokens');
  CONNECTIONS.spotify.connected = false;
  CONNECTIONS.spotify.profile = null;
  if(spPlayer){ try{ spPlayer.disconnect(); }catch(e){} spPlayer=null; spDeviceId=null; }
  persist();
  toast('Desconectaste tu cuenta de Spotify');
  renderView();
}

/* ===== ARES GALAXY — REPRODUCCIÓN REAL: SPOTIFY WEB PLAYBACK SDK =====
   Reproduce la canción COMPLETA real (no un clip) directamente en esta
   pestaña, convirtiéndola en un dispositivo de Spotify Connect. Es la única
   forma oficial y legítima de reproducir audio íntegro de Spotify en una
   app web (Spotify ya no expone clips de 30s por la Web API desde nov. 2024).
   Requisito no negociable de Spotify: la cuenta debe ser Premium — con
   cuenta gratuita el SDK simplemente no reproduce nada.
*/
let spPlayer = null;
let spDeviceId = null;
let spPlayerReadyPromise = null;
function loadSpotifySdk(){
  return new Promise((resolve, reject)=>{
    if(window.Spotify && window.Spotify.Player){ resolve(); return; }
    const prevReady = window.onSpotifyWebPlaybackSDKReady;
    window.onSpotifyWebPlaybackSDKReady = ()=>{ if(prevReady) prevReady(); resolve(); };
    const s = document.createElement('script');
    s.src = 'https://sdk.scdn.co/spotify-player.js';
    s.onerror = ()=>reject(new Error('No se pudo cargar el SDK de reproducción de Spotify'));
    document.head.appendChild(s);
  });
}
async function ensureSpotifyPlayer(){
  if(spDeviceId) return spDeviceId;
  if(spPlayerReadyPromise) return spPlayerReadyPromise;
  spPlayerReadyPromise = (async ()=>{
    await loadSpotifySdk();
    spPlayer = new Spotify.Player({
      name: 'Ares Galaxy',
      getOAuthToken: async (cb)=>{ const t = await spEnsureToken(); cb(t || ''); },
      volume: 0.85,
    });
    spPlayer.addListener('ready', ({device_id})=>{ spDeviceId = device_id; });
    spPlayer.addListener('not_ready', ()=>{ spDeviceId = null; });
    spPlayer.addListener('initialization_error', ({message})=>{ toast('Spotify Player: '+message); });
    spPlayer.addListener('authentication_error', ()=>{ toast('Spotify necesita que vuelvas a conectar tu cuenta'); });
    spPlayer.addListener('account_error', ()=>{ toast('Reproducir audio completo de Spotify requiere una cuenta Premium'); });
    await spPlayer.connect();
    const start = Date.now();
    while(!spDeviceId && Date.now()-start < 8000){ await new Promise(r=>setTimeout(r,150)); }
    return spDeviceId;
  })();
  const id = await spPlayerReadyPromise;
  spPlayerReadyPromise = null;
  return id;
}
async function spotifyPlayTrack(trackId){
  try{
    const deviceId = await ensureSpotifyPlayer();
    if(!deviceId){ toast('No se pudo iniciar el reproductor de Spotify (revisa que tu cuenta sea Premium)'); return false; }
    const token = await spEnsureToken();
    const res = await fetch('https://api.spotify.com/v1/me/player/play?device_id='+deviceId, {
      method:'PUT', headers:{ Authorization:'Bearer '+token, 'Content-Type':'application/json' },
      body: JSON.stringify({ uris:['spotify:track:'+trackId] })
    });
    if(res.status===403){ toast('Reproducir audio completo requiere Spotify Premium — sonando el clip generativo en su lugar'); return false; }
    if(res.status===404){ toast('El dispositivo de reproducción no está listo, intenta de nuevo'); return false; }
    if(!res.ok && res.status!==204){ toast('Spotify no pudo iniciar la reproducción (error '+res.status+')'); return false; }
    return true;
  }catch(e){ console.error(e); toast('No se pudo reproducir el audio real de Spotify'); return false; }
}
function spotifyPausePlayback(){
  if(spPlayer){ try{ spPlayer.pause(); }catch(e){} }
}

/* ===== ARES GALAXY — REPRODUCCIÓN REAL: YOUTUBE IFRAME PLAYER =====
   Reproductor oficial y gratuito de YouTube (no requiere cuenta Premium ni
   ningún pago) para las canciones que vienen de tu "Me gusta" de YouTube.
*/
let ytPlayer = null;
let ytPlayerReady = false;
function loadYoutubeIframeApi(){
  return new Promise((resolve)=>{
    if(window.YT && window.YT.Player){ resolve(); return; }
    const prevReady = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = ()=>{ if(prevReady) prevReady(); resolve(); };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  });
}
function ytMountEl(){
  let el = document.getElementById('yt-player-mount');
  if(!el){
    el = document.createElement('div');
    el.id = 'yt-player-mount';
    el.style.cssText = 'position:fixed; right:16px; bottom:96px; width:160px; height:90px; z-index:85; border-radius:14px; overflow:hidden; box-shadow:var(--shadow-pop); border:1px solid var(--line-soft); display:none;';
    document.body.appendChild(el);
  }
  return el;
}
async function ensureYoutubePlayer(){
  if(ytPlayer && ytPlayerReady) return ytPlayer;
  await loadYoutubeIframeApi();
  ytMountEl();
  return new Promise((resolve)=>{
    ytPlayer = new YT.Player('yt-player-mount', {
      height:'90', width:'160',
      playerVars:{ autoplay:1, controls:1 },
      events:{
        onReady: ()=>{ ytPlayerReady = true; resolve(ytPlayer); },
        onStateChange: (e)=>{ if(window.YT && e.data===YT.PlayerState.ENDED) stopPreview(); },
        onError: ()=>{
          const failedSong = current && current.kind==='youtube' ? findSong(current.songId) : null;
          toast('Ese video de YouTube no se puede reproducir aquí (restringido o eliminado)' + (failedSong ? ' — sonando el clip generativo' : ''));
          const el = document.getElementById('yt-player-mount'); if(el) el.style.display='none';
          current = null;
          if(failedSong) playSynthPreview(failedSong); else if(typeof onPreviewChange==='function') onPreviewChange(null);
        },
      }
    });
  });
}
async function youtubePlayVideo(videoId){
  const player = await ensureYoutubePlayer();
  ytMountEl().style.display = 'block';
  player.loadVideoById(videoId);
}
function youtubePausePlayback(){
  if(ytPlayer && ytPlayerReady){ try{ ytPlayer.pauseVideo(); }catch(e){} }
  const el = document.getElementById('yt-player-mount');
  if(el) el.style.display = 'none';
}

/* ===== ARES GALAXY — INTEGRACIÓN REAL: YOUTUBE (Google Identity Services) =====
   No existe una API pública oficial de "YouTube Music" en sí misma. Esta
   conexión usa la YouTube Data API v3 (oficial, gratuita, con cupo diario)
   sobre la playlist de "Videos que me gustan" del usuario como la mejor
   aproximación real disponible a su actividad musical en YouTube. Es OAuth
   100% client-side (Token Client de Google), sin backend ni secreto.
*/
const YT_SCOPE = 'https://www.googleapis.com/auth/youtube.readonly';
function ytGetConfig(){ return JSON.parse(localStorage.getItem('aresGalaxy.googleConfig')||'null') || { clientId:'' }; }
function ytSetConfig(cfg){ localStorage.setItem('aresGalaxy.googleConfig', JSON.stringify(cfg)); }
function saveYoutubeConfig(){
  const clientId = document.getElementById('yt-clientid').value.trim();
  const cfg = ytGetConfig(); cfg.clientId = clientId; ytSetConfig(cfg);
  toast('Configuración de Google/YouTube guardada');
}
function loadGsiScript(){
  return new Promise((resolve,reject)=>{
    if(window.google && window.google.accounts && window.google.accounts.oauth2){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('No se pudo cargar Google Identity Services'));
    document.head.appendChild(s);
  });
}
async function youtubeConnect(){
  const cfg = ytGetConfig();
  if(!cfg.clientId){
    toast('Primero configura tu Client ID de Google' + (state.onboarded ? '' : ' (crea tu galaxia local y ve a Conexiones)'));
    if(state.onboarded) go('connections');
    return;
  }
  try{ await loadGsiScript(); }catch(e){ toast('No se pudo cargar el SDK de Google (revisa tu conexión a internet)'); return; }
  const client = google.accounts.oauth2.initTokenClient({
    client_id: cfg.clientId, scope: YT_SCOPE,
    callback: async (resp)=>{
      if(resp.error){ toast('Google no autorizó la conexión: '+resp.error); return; }
      localStorage.setItem('aresGalaxy.yt.token', JSON.stringify({ access_token:resp.access_token, expires_at:Date.now()+(resp.expires_in*1000)-8000 }));
      toast('YouTube conectado — trayendo tu actividad…');
      await youtubeSync();
    }
  });
  client.requestAccessToken();
}
function ytGetToken(){
  const t = JSON.parse(localStorage.getItem('aresGalaxy.yt.token')||'null');
  return (t && Date.now() < t.expires_at) ? t.access_token : null;
}
async function ytFetch(path, params){
  const token = ytGetToken();
  if(!token) throw new Error('sin token de Google');
  const url = 'https://www.googleapis.com/youtube/v3'+path+'?'+new URLSearchParams(params||{});
  const res = await fetch(url, { headers:{ Authorization:'Bearer '+token } });
  if(!res.ok) throw new Error('YouTube API error '+res.status);
  return res.json();
}
function songFromYoutubeItem(it){
  const title = it.snippet.title;
  let artist = it.snippet.videoOwnerChannelTitle || it.snippet.channelTitle || 'YouTube';
  let songTitle = title;
  const parts = title.split(' - ');
  if(parts.length>1){ artist = parts[0].trim(); songTitle = parts.slice(1).join(' - ').trim(); }
  const vid = it.snippet.resourceId && it.snippet.resourceId.videoId;
  if(!vid) return null;
  return upsertSong({ id:'yt-'+vid, title:songTitle, artist, art:artClassFor(vid), saved:true, tag:'YouTube', source:'youtube' });
}
async function youtubeSync(){
  try{
    const ch = await ytFetch('/channels', {part:'contentDetails,snippet', mine:'true'});
    const me = ch.items && ch.items[0];
    const likesId = me && me.contentDetails && me.contentDetails.relatedPlaylists && me.contentDetails.relatedPlaylists.likes;
    let pulled = 0;
    if(likesId){
      const liked = await ytFetch('/playlistItems', {part:'snippet', playlistId:likesId, maxResults:25});
      (liked.items||[]).forEach(it=>{ if(songFromYoutubeItem(it)) pulled++; });
    }
    CONNECTIONS.youtube.connected = true;
    CONNECTIONS.youtube.profile = me ? { name: me.snippet.title } : null;
    CONNECTIONS.youtube.lastSync = Date.now();
    CONNECTIONS.youtube.counts = { canciones: pulled };
    const firstBoot = !state.onboarded;
    if(firstBoot){ state.onboarded = true; state.gate = 'app'; }
    persist();
    toast(pulled ? `YouTube conectado — ${pulled} elementos desde tus "Me gusta"` : 'YouTube conectado — no encontramos videos en "Me gusta" para traer');
    location.hash = '#/' + (firstBoot ? 'home' : (state.route||'home'));
    render();
  }catch(e){
    console.error(e);
    toast('Se conectó YouTube pero hubo un problema trayendo tu actividad.');
    render();
  }
}
function youtubeDisconnect(){
  localStorage.removeItem('aresGalaxy.yt.token');
  CONNECTIONS.youtube.connected = false;
  CONNECTIONS.youtube.profile = null;
  persist();
  toast('Desconectaste tu cuenta de YouTube');
  renderView();
}

/* ===== ARES GALAXY — IMPORTACIÓN UNIVERSAL DE DATOS =====
   Alternativa 100% local y funcional para cualquier plataforma (incluidas
   las que no tienen API pública, como Amazon Music o Claro Música): subir o
   pegar un archivo .json/.csv con canciones. Se procesa por completo en el
   navegador con FileReader — nada se sube a ningún servidor.
*/
function openImport(platform){
  state.modal = { type:'import', platform: platform || null };
  renderOverlays();
}
function handleImportFile(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=> doImport(String(reader.result), state.modal && state.modal.platform);
  reader.readAsText(file);
}
function doImportFromTextarea(){
  const el = document.getElementById('import-text');
  doImport(el ? el.value : '', state.modal && state.modal.platform);
}
function parseImportPayload(raw){
  raw = (raw||'').trim();
  if(!raw) return [];
  try{
    const data = JSON.parse(raw);
    const arr = Array.isArray(data) ? data : (data.tracks || data.songs || data.items || []);
    return arr.map(x=>({
      title: x.title || x.name || x.track || '',
      artist: Array.isArray(x.artist) ? x.artist.join(', ') : (x.artist || x.artists || x.author || ''),
      playlist: x.playlist || x.album || null,
    })).filter(x=>x.title && x.artist);
  }catch(e){ /* not JSON, try CSV below */ }
  const lines = raw.split(/\r?\n/).filter(Boolean);
  if(!lines.length) return [];
  const headerLine = lines[0].toLowerCase();
  const hasHeader = headerLine.includes('title') && headerLine.includes('artist');
  const rows = hasHeader ? lines.slice(1) : lines;
  return rows.map(line=>{
    const cols = line.split(',').map(c=>c.trim().replace(/^"|"$/g,''));
    return { title: cols[0]||'', artist: cols[1]||'', playlist: cols[2]||null };
  }).filter(x=>x.title && x.artist);
}
function doImport(raw, platform){
  const rows = parseImportPayload(raw);
  if(!rows.length){ toast('No encontramos canciones válidas en ese archivo/texto (usa columnas title, artist)'); return; }
  let count = 0;
  rows.forEach(r=>{
    const id = 'imp-' + hashStr(r.title+'|'+r.artist+'|'+(platform||''));
    upsertSong({ id, title:r.title, artist:r.artist, art:artClassFor(id), saved:true, tag:r.playlist||null, source: platform || 'importado' });
    count++;
  });
  if(platform && CONNECTIONS[platform]){
    CONNECTIONS[platform].connected = true;
    CONNECTIONS[platform].lastSync = Date.now();
    CONNECTIONS[platform].counts = { canciones: ((CONNECTIONS[platform].counts&&CONNECTIONS[platform].counts.canciones)||0) + count, importado:true };
  }
  const firstBoot = !state.onboarded;
  if(firstBoot){ state.onboarded = true; state.gate = 'app'; }
  persist();
  closeModal();
  toast(`Importaste ${count} canción${count===1?'':'es'}${platform && PLATFORM_META[platform] ? ' desde '+PLATFORM_META[platform].label : ''}`);
  location.hash = '#/' + (firstBoot ? 'home' : (state.route||'home'));
  render();
}

}

function viewAI(){
  return `
  <div class="view-enter">

      <div>

        <h1 class="page-title">Tu bibliotecario musical.</h1>

      <div class="chat-log" id="chat-log">
        ${state.chat.map(chatBubble).join('')}
        ${state.chatBusy ? `<div class="msg ai"><span class="ai-tag">ARES AI</span><div class="typing-dots"><span></span><span></span><span></span></div></div>` : ''}
      </div>
      <div class="chat-suggestions">${AI_SUGGESTIONS.map((s,i)=>`<button class="tab" onclick="sendChat(AI_SUGGESTIONS[${i}])">${s}</button>`).join('')}</div>
      <div class="chat-input-bar">
        <input id="chat-input" placeholder="Pregúntale algo a tu bibliotecario musical…" onkeydown="if(event.key==='Enter')sendChatFromInput()"/>
        <button class="icon-btn" onclick="sendChatFromInput()">${ICONS.send}</button>
      </div>
    </div>
  </div>`;
}
function chatBubble(m){
  if(m.role==='user') return `<div class="msg user">${m.text}</div>`;
  return `<div class="msg ai"><span class="ai-tag">ARES AI</span>${m.text}
    ${m.songs && m.songs.length ? m.songs.map(id=>{
      const s = findSong(id); if(!s) return '';
      return `<div class="chat-song-result">
        <div class="mini-art ${s.art}"></div>
        <div class="csr-meta"><b>${s.title}</b><span>${s.artist}</span></div>
        <button class="mini-btn" onclick="togglePreview('${s.id}')" title="Escuchar micro-clip">${(state.playing && state.playing.songId===s.id)?ICONS.pause:ICONS.play}</button>
        <button class="mini-btn ${s.saved?'saved':''}" onclick="toggleSave('${s.id}')">${ICONS.save}</button>
      </div>`;
    }).join('') : ''}
  </div>`;
}
function sendChatFromInput(){
  const inp = document.getElementById('chat-input');
  const val = inp.value.trim();
  if(!val) return;
  inp.value = '';
  sendChat(val);
}
function sendChat(text){
  if(state.chatBusy) return;
  state.chat.push({role:'user', text});
  state.chatBusy = true;
  renderView();
  scrollChat();
  setTimeout(()=>{
    const r = aiRespond(text);
    state.chat.push({role:'ai', text:r.text, songs:r.songs});
    state.chatBusy = false;
    renderView();
    scrollChat();
  }, 1100 + Math.random()*500);
}
function scrollChat(){
  const log = document.getElementById('chat-log');
  if(log) log.scrollTop = log.scrollHeight;
}

function submitMemory(){
  const songSel = document.getElementById('mm-song');
  const song = findSong(songSel.value);
  const dateVal = document.getElementById('mm-date').value;
  const place = document.getElementById('mm-place').value || 'Sin ubicación';
  const people = document.getElementById('mm-people').value.split(',').map(s=>s.trim()).filter(Boolean);
  const note = document.getElementById('mm-note').value || 'Un momento que se quedó pegado a esta canción.';
  const tags = [...document.querySelectorAll('#mm-tags .tag-opt.on')].map(b=>b.dataset.tag);
  const dateLabel = dateVal ? new Date(dateVal+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'}) : 'Sin fecha';
  song.saved = true;
  const newMem = { id:'m'+(MEMORIES.length+1)+'-'+Date.now(), songId:song.id, song:song.title, artist:song.artist, art:song.art, date:dateLabel, note, place, people: people.length?people:['Yo'], tags: tags.length?tags:['Nueva memoria'] };
  MEMORIES.unshift(newMem);
  persist();
  closeModal();
  toast('Memoria guardada en tu galaxia');
  state.route = 'archive';
  location.hash = '#/archive';
  render();
}

function obToggle(field, val){
  const arr = state.ob[field];
  const i = arr.indexOf(val);
  if(i>-1) arr.splice(i,1); else arr.push(val);
  renderOnboarding();
}
function obAddFriend(){
  const inp = document.getElementById('ob-friend-input');
  const val = inp ? inp.value.trim() : '';
  if(!val) return;
  const handle = val.startsWith('@') ? val : '@'+val;
  if(!state.ob.friends.includes(handle)) state.ob.friends.push(handle);
  if(inp) inp.value = '';
  renderOnboarding();
}
function obRemoveFriend(i){ state.ob.friends.splice(i,1); renderOnboarding(); }
function addFriendHandle(raw){
  const val = (raw||'').trim();
  if(!val) return;
  const handle = val.startsWith('@') ? val : '@'+val;
  if(!PENDING_FRIENDS.includes(handle)) PENDING_FRIENDS.push(handle);
  persist();
}
function removeFriendHandle(i){ PENDING_FRIENDS.splice(i,1); persist(); }
function profileAddFriend(){
  const inp = document.getElementById('profile-friend-input');
  addFriendHandle(inp ? inp.value : '');
  if(inp) inp.value = '';
  renderView();
}
function obSkip(){ state.ob.step = 5; renderOnboarding(); runGenerate(); }
function obNext(){
  if(state.ob.step===0){
    const nameInput = document.getElementById('ob-name');
    const val = nameInput ? nameInput.value.trim() : '';
    if(!val){
      if(nameInput){
        nameInput.style.borderColor = 'var(--magenta)';
        nameInput.placeholder = 'Escribe tu nombre para continuar';
        nameInput.focus();
      }
      return;
    }
    state.ob.name = val;
  }
  if(state.ob.step===3){
    state.ob.memoryNote = document.getElementById('ob-note') ? document.getElementById('ob-note').value : '';
    state.ob.memorySong = document.getElementById('ob-song') ? document.getElementById('ob-song').value : '';
  }
  state.ob.step++;
  if(state.ob.step>5) state.ob.step=5;
  renderOnboarding();
  if(state.ob.step===5) runGenerate();
}
