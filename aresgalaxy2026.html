function gateGoOnboarding(){ state.gate='onboarding'; state.ob.step=0; renderOnboarding(); }

function renderOnboarding(){
  const root = document.getElementById('onboarding-root');
  if(!root) return;
  root.innerHTML = state.onboarded ? '' : gateHTML();
}
function runGenerate(){
  const lines = ['Conectando artistas con etapas','Tejiendo memorias y lugares','Sincronizando con tus comunidades','Encendiendo tu galaxia'];
  let i=0;
  const iv = setInterval(()=>{
    i++;
    const el = document.getElementById('gen-line');
    if(el && lines[i]) el.textContent = lines[i];
    if(i>=lines.length){ clearInterval(iv); finishOnboarding(); }
  }, 650);
}
function finishOnboarding(){
  setTimeout(()=>{
    if(state.ob.name){
      USER.name = state.ob.name;
      USER.handle = '@' + slugify(state.ob.name);
    }
    const firstName = USER.name.split(' ')[0];
    state.chat = [{ role:'ai', text:`¡Hola ${firstName}! Soy tu bibliotecario musical. No reemplazo tu criterio — lo ayudo a conectar. Pregúntame por una época, un ánimo o una persona.`, songs: [] }];

    const raw = (state.ob.memorySong||'').trim();
    if(raw){
      let title = raw, artist = 'Artista desconocido';
      if(raw.includes('—')){ const parts = raw.split('—'); title = parts[0].trim(); artist = parts.slice(1).join('—').trim(); }
      else if(raw.includes(' - ')){ const parts = raw.split(' - '); title = parts[0].trim(); artist = parts.slice(1).join(' - ').trim(); }
      let song = SONGS.find(s=> s.title.toLowerCase()===title.toLowerCase());
      if(!song){
        song = { id:'ob-'+Date.now(), title, artist, art:'art-5', saved:true, tag:'Tu primer recuerdo' };
        SONGS.unshift(song);
      } else { song.saved = true; }
      MEMORIES.unshift({
        id:'ob-mem-'+Date.now(), songId:song.id, song:song.title, artist:song.artist, art:song.art,
        date:'Onboarding · 2026', note: state.ob.memoryNote || 'La primera canción que conectaste a tu galaxia.',
        place: USER.city.split(',')[0], people:['Yo'], tags: state.ob.eras.length ? [state.ob.eras[0].split(' ')[0]] : ['Primer recuerdo']
      });
    }
    PENDING_FRIENDS = [...(state.ob.friends||[])];
    state.onboarded = true;
    state.gate = 'app';
    persist();
    document.getElementById('onboarding-root').innerHTML = '';
    toast(`Tu galaxia está lista, ${firstName} ✨`);
    state.route = 'home';
    location.hash = '#/home';
    render();
  }, 500);
}

/* ---------- RENDER OVERLAYS (drawer/modal only) ---------- */
function renderOverlays(){
  document.getElementById('overlay-root').innerHTML = drawerHTML() + modalHTML();
}

/* ---------- MAIN RENDER ---------- */
function renderView(){
  const view = document.getElementById('view');
  if(!view) return;
  let html = '';
  let match;
  if(state.route==='home') html = viewHome();
  else if(state.route==='discover') html = viewDiscover();
  else if(state.route==='galaxy') html = viewGalaxy();
  else if(state.route==='archive') html = viewArchive();
  else if(state.route==='connections') html = viewConnections();
  else if(state.route==='communities') html = viewCommunities();
  else if(match = state.route.match(/^community\/(.+)$/)) html = viewCommunityDetail(match[1]);
  else if(state.route==='ai') html = viewAI();
  else if(state.route==='events') html = viewEvents();
  else if(state.route==='profile') html = viewProfile();
  else html = viewHome();
  view.innerHTML = html;

  // update nav active state without full shell rerender flicker
  document.querySelectorAll('.nav-item, .bottom-nav a').forEach(a=>{
    const r = a.getAttribute('href').replace('#/','');
    a.classList.toggle('active', r===state.route);
  });

  killGalaxies();
  if(state.route==='home') mountGalaxy('home-galaxy-canvas', {interactive:false, onClick:()=>go('galaxy')});
  if(state.route==='profile') mountGalaxy('profile-galaxy-canvas', {interactive:false, onClick:()=>go('galaxy')});
  if(state.route==='galaxy') mountGalaxy('full-galaxy-canvas', {interactive:true});
  if(state.route==='ai') scrollChat();
}

function render(){
  document.getElementById('shell').innerHTML = shellHTML();
  renderView();
  bindGlobalUI();
  renderOverlays();
  renderOnboarding();
  renderMiniPlayer();
}

function bindGlobalUI(){
  const btn = document.getElementById('btn-add-memory');
  if(btn) btn.onclick = ()=>openAddMemory();
  const search = document.getElementById('global-search');
  if(search){
    search.onkeydown = (e)=>{
      if(e.key==='Enter' && search.value.trim()){
        const q = search.value.trim();
        state.discoverTab = 'songs';
        state.route = 'discover';
        location.hash = '#/discover';
        toast(`Explorando “${q}” en Discover`);
        render();
      }
    };
  }
}

async function boot(){
  restore(); // trae la galaxia guardada en este navegador, si existe
  const qs = new URLSearchParams(window.location.search);
  const isOAuthReturn = qs.has('code') || qs.has('error');
  if(isOAuthReturn){
    state.gate = 'connecting';
    render();
    await spotifyHandleCallback();
  }
  state.gate = state.onboarded ? 'app' : (state.gate==='login' || state.gate==='onboarding' ? state.gate : 'landing');
  state.route = (location.hash.replace('#/','') || 'home');
  render();
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
