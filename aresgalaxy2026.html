/* ---------- REPRODUCCIÓN REAL (Spotify / YouTube) + COLA ----------
   La galaxia (y el resto de la app) nunca reproducen una canción suelta:
   siempre lo hacen dentro de una "cola" (state.queue, ids reales de SONGS)
   que la app gestiona en el cliente. Esto es necesario porque la API
   pública de Spotify no permite reordenar/leer una cola de reproducción
   de forma completa — así que replicamos esa experiencia nosotros mismos,
   reproduciendo siempre audio real (Spotify o YouTube) canción por canción.
*/
function togglePreview(id, evt){
  if(evt){ evt.stopPropagation(); evt.preventDefault && evt.preventDefault(); }
  const song = findSong(id);
  if(!song) return;
  if(current && current.songId===id){
    if(current.paused) resumePreview(); else pausePreview();
    return;
  }
  const idx = state.queue.indexOf(id);
  if(idx>-1){ state.queueIndex = idx; }
  else { state.queue = [id]; state.queueIndex = 0; }
  playPreview(song);
}
function stopPreviewFully(evt){ if(evt){ evt.stopPropagation(); } stopPreview(); }
// Reproduce songId dentro de una lista de contexto real (por ejemplo: todo
// Discover, todos los resultados de búsqueda, todas las canciones de un
// artista) para que Siguiente/Anterior tengan sentido real.
function playListContext(ids, songId){
  const clean = (ids||[]).filter(Boolean);
  state.queue = clean.length ? clean : [songId];
  state.queueIndex = Math.max(0, state.queue.indexOf(songId));
  const song = findSong(songId);
  if(song) playPreview(song);
}
// Solo Spotify/YouTube con la plataforma conectada pueden sonar de verdad
// dentro de la app. Siguiente/Anterior saltan automáticamente las canciones
// de la cola que no tengan esa fuente real (en vez de dejar el reproductor
// mudo o desaparecer sin explicación).
function songIsPlayable(song){
  if(!song) return false;
  if(song.source==='spotify' && CONNECTIONS.spotify.connected) return true;
  if(song.source==='youtube' && CONNECTIONS.youtube.connected) return true;
  return false;
}
function playNext(auto){
  const n = state.queue.length;
  if(!n){ if(auto) stopPreview(); return; }
  let candidates = [];
  if(auto){ for(let i=state.queueIndex+1;i<n;i++) candidates.push(i); }
  else { for(let i=1;i<=n;i++) candidates.push((state.queueIndex+i)%n); }
  for(const idx of candidates){
    const song = findSong(state.queue[idx]);
    if(song && songIsPlayable(song)){ state.queueIndex = idx; playPreview(song); return; }
  }
  if(auto) stopPreview();
  else toast('No hay más canciones reproducibles en la cola ahora mismo');
}
function playPrev(){
  const n = state.queue.length;
  if(!n) return;
  for(let i=1;i<=n;i++){
    const idx = ((state.queueIndex - i) % n + n) % n;
    const song = findSong(state.queue[idx]);
    if(song && songIsPlayable(song)){ state.queueIndex = idx; playPreview(song); return; }
  }
  toast('No hay canciones reproducibles anteriores en la cola');
}
async function seekPreview(fraction){
  if(!current) return;
  fraction = Math.max(0, Math.min(1, fraction));
  try{
    if(current.kind==='spotify' && spPlayer){
      const st = await spPlayer.getCurrentState();
      if(st && st.duration) await spPlayer.seek(Math.round(st.duration*fraction));
    } else if(current.kind==='youtube' && ytPlayer && typeof ytPlayer.getDuration==='function'){
      const dur = ytPlayer.getDuration();
      if(dur) ytPlayer.seekTo(dur*fraction, true);
    }
  }catch(e){ console.warn('No se pudo saltar dentro de la canción', e); }
  onPreviewProgress(fraction);
}
function onSeekBarClick(evt, el){
  const rect = (el||evt.currentTarget).getBoundingClientRect();
  const frac = (evt.clientX - rect.left) / rect.width;
  seekPreview(frac);
}
// ---- Cola: agregar / quitar / reordenar / reproducir ya ----
function queueAdd(songId){
  if(!state.queue.includes(songId)) state.queue.push(songId);
  else toast('Esa canción ya está en tu cola');
  toast('Agregada a la cola');
  renderQueuePanel(); renderExpandedPlayer();
}
function queuePlayNext(songId){
  state.queue = state.queue.filter(id=>id!==songId);
  const insertAt = state.queueIndex>-1 ? state.queueIndex+1 : state.queue.length;
  state.queue.splice(insertAt, 0, songId);
  toast('Sonará después de esta');
  renderQueuePanel(); renderExpandedPlayer();
}
function queueRemove(idx){
  if(idx===state.queueIndex){ toast('No puedes quitar la canción que está sonando'); return; }
  state.queue.splice(idx,1);
  if(idx < state.queueIndex) state.queueIndex--;
  renderQueuePanel(); renderExpandedPlayer();
}
function queueMove(idx, dir){
  const to = idx+dir;
  if(to<0 || to>=state.queue.length) return;
  const [item] = state.queue.splice(idx,1);
  state.queue.splice(to,0,item);
  if(idx===state.queueIndex) state.queueIndex = to;
  else if(to===state.queueIndex) state.queueIndex = idx;
  renderQueuePanel(); renderExpandedPlayer();
}
function queuePlayAt(idx){
  const song = findSong(state.queue[idx]);
  if(!song) return;
  state.queueIndex = idx;
  playPreview(song);
}
function toggleQueuePanel(){ state.queueOpen = !state.queueOpen; renderQueuePanel(); }
function togglePlayerExpanded(){ state.playerExpanded = !state.playerExpanded; renderExpandedPlayer(); }

function onPreviewChange(info){
  state.playing = info;
  renderMiniPlayer();
  renderQueuePanel();
  renderExpandedPlayer();
  renderView();
}
function onPreviewProgress(progress){
  document.querySelectorAll('.mp-progress-fill').forEach(el=> el.style.width = (progress*100).toFixed(1)+'%');
}
function playerControlsHTML(size){
  const hasNext = state.queue.length>1;
  const isPaused = state.playing && state.playing.paused;
  return `
    <button class="icon-btn ${size==='lg'?'player-btn-lg':''}" onclick="playPrev()" title="Anterior" ${hasNext?'':'disabled'}>${ICONS.prev}</button>
    <button class="icon-btn ${size==='lg'?'player-btn-lg player-btn-main':''}" onclick="togglePreview(state.playing.songId)" title="${isPaused?'Reanudar':'Pausar'}">${isPaused?ICONS.play:ICONS.pause}</button>
    <button class="icon-btn ${size==='lg'?'player-btn-lg':''}" onclick="playNext(false)" title="Siguiente" ${hasNext?'':'disabled'}>${ICONS.next}</button>`;
}
function renderMiniPlayer(){
  const root = document.getElementById('mini-player-root');
  if(!root) return;
  if(!state.playing){ root.innerHTML=''; return; }
  const { song } = state.playing;
  const upcoming = state.queue.length - (state.queueIndex+1);
  root.innerHTML = `
  <div class="mini-player">
    <div class="mini-player-top">
      <div class="mini-player-art ${songArtClass(song)}" onclick="togglePlayerExpanded()" style="cursor:pointer; ${songArtStyle(song)}"></div>
      <div class="mini-player-meta" onclick="togglePlayerExpanded()" style="cursor:pointer;"><b>${song.title}</b><span>${song.artist}</span></div>
      <div class="mini-player-controls">${playerControlsHTML()}</div>
      <button class="icon-btn" onclick="toggleQueuePanel()" title="Siguientes canciones">${ICONS.queue}${upcoming>0?`<span class="mp-queue-badge">${upcoming}</span>`:''}</button>
      <button class="icon-btn" onclick="togglePlayerExpanded()" title="Expandir">${ICONS.expand}</button>
      <button class="icon-btn" onclick="stopPreviewFully(event)" title="Cerrar reproductor">${ICONS.close}</button>
    </div>
    <div class="mini-player-progress" onclick="onSeekBarClick(event, this)"><div class="mini-player-progress-fill mp-progress-fill" id="mp-progress-fill"></div></div>
    <div class="mini-player-note">AUDIO REAL VÍA ${(state.playing.platformLabel || '').toUpperCase()}${upcoming>0?` · ${upcoming} más en cola`:''}</div>
  </div>`;
  renderQueuePanel();
}
/* ---------- PANEL DE COLA ("Siguientes canciones") ---------- */
function renderQueuePanel(){
  const root = document.getElementById('queue-panel-root');
  if(!root) return;
  if(!state.queueOpen || !state.playing){ root.innerHTML=''; return; }
  const items = state.queue.map((id,i)=>({id, i, song:findSong(id)})).filter(x=>x.song);
  root.innerHTML = `
  <div class="queue-overlay" onclick="if(event.target===this){ state.queueOpen=false; renderQueuePanel(); }">
    <div class="queue-panel">
      <div class="queue-panel-head">
        <b>Siguientes canciones</b>
        <button class="drawer-close" onclick="state.queueOpen=false; renderQueuePanel();">${ICONS.close}</button>
      </div>
      <div class="queue-panel-body">
        ${items.length ? items.map(({id,i,song})=>`
          <div class="queue-row ${i===state.queueIndex?'is-current':''}">
            <div class="song-art ${songArtClass(song)}" style="width:38px;height:38px;margin:0;border-radius:8px; flex:none; cursor:pointer; ${songArtStyle(song)}" onclick="queuePlayAt(${i})"></div>
            <div style="flex:1; min-width:0; cursor:pointer;" onclick="queuePlayAt(${i})">
              <div style="font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${song.title}</div>
              <div style="font-size:10.5px; color:var(--mute);">${song.artist}${i===state.queueIndex?' · sonando':''}</div>
            </div>
            <button class="mini-btn" onclick="queueMove(${i},-1)" title="Subir" ${i===0?'disabled':''}>↑</button>
            <button class="mini-btn" onclick="queueMove(${i},1)" title="Bajar" ${i===items.length-1?'disabled':''}>↓</button>
            <button class="mini-btn" onclick="queueRemove(${i})" title="Quitar de la cola" ${i===state.queueIndex?'disabled':''}>${ICONS.close}</button>
          </div>`).join('') : `<p style="font-size:12px; color:var(--mute-2); text-align:center; padding:20px 0;">No hay más canciones en la cola.</p>`}
      </div>
    </div>
  </div>`;
}
/* ---------- REPRODUCTOR EXPANDIDO (premium, integrado a la galaxia) ---------- */

/* ---------- NAVEGACIÓN MUSICAL: UNIVERSO DE UN ARTISTA ----------
   Canción → artista → canciones relacionadas → otra conexión. La API
   pública de Spotify ya no expone "recomendaciones" ni "artistas
   relacionados" (retirados desde nov-2024), así que este "universo" se
   construye con datos 100% reales por otra vía honesta: la discografía real
   del artista (GET /artists/{id}/albums + /albums/{id}/tracks, que sí siguen
   disponibles) o, si no tenemos su ID, una búsqueda real por su nombre.
*/
async function exploreArtistUniverse(artistName, artistId){
  if(!artistName) return;
  state.galaxyFocus = { name:artistName, id:artistId||null, items:[], loading:true, error:null };
  state.route = 'discover'; location.hash = '#/discover';
  render();
  if(!CONNECTIONS.spotify.connected){
    state.galaxyFocus.loading = false;
    state.galaxyFocus.error = 'not-connected';
    renderView();
    return;
  }
  try{
    let tracks = [];
    if(artistId){
      try{
        const albums = await spFetch(`/artists/${artistId}/albums`, {limit:6, include_groups:'album,single'});
        for(const alb of (albums.items||[]).slice(0,4)){
          try{
            const albTracks = await spFetch(`/albums/${alb.id}/tracks`, {limit:8});
            (albTracks.items||[]).forEach(t=> tracks.push(Object.assign({}, t, { album:{images:alb.images} })));
          }catch(e){ console.warn('album tracks failed', e); }
        }
      }catch(e){ console.warn('artist albums failed', e); }
    }
    if(!tracks.length){
      const data = await spFetch('/search', { q:`artist:"${artistName}"`, type:'track', limit:10 });
      tracks = (data.tracks && data.tracks.items) || [];
    }
    const songs = tracks.filter(Boolean).map(t=>songFromSpotifySearchTrack(t)).filter(Boolean);
    const uniqueIds = [...new Set(songs.map(s=>s.id))];
    state.galaxyFocus = { name:artistName, id:artistId||null, items:uniqueIds, loading:false, error: uniqueIds.length?null:'empty' };
    persist();
  }catch(e){
    console.error('No se pudo explorar el universo del artista', e);
    state.galaxyFocus.loading = false;
    state.galaxyFocus.error = 'error';
  }
  renderView();
}
function closeArtistUniverse(){ state.galaxyFocus = null; renderView(); }
function viewArtistUniverse(){
  const f = state.galaxyFocus;
  const songs = (f.items||[]).map(findSong).filter(Boolean);
  let body;
  if(f.loading){
    body = `<div class="panel panel-pad" style="text-align:center; color:var(--mute-2);">Explorando el universo de ${f.name}…</div>`;
  } else if(f.error==='not-connected'){
    body = `<div class="panel panel-pad" style="text-align:center;"><p class="page-sub" style="margin:0 0 12px;">Conecta Spotify para explorar artistas con música real.</p><a href="#/connections" class="pill-btn" style="display:inline-flex;">${ICONS.link} Ir a Conexiones</a></div>`;
  } else if(f.error==='error'){
    body = `<div class="panel panel-pad" style="text-align:center; color:var(--mute-2);">No pudimos traer el universo de ${f.name} ahora mismo. Intenta de nuevo.</div>`;
  } else if(!songs.length){
    body = `<div class="panel panel-pad" style="text-align:center; color:var(--mute-2);">No encontramos canciones reales de ${f.name} por ahora.</div>`;
  } else {
    body = `<div class="grid g4">${songs.map(s=>songCard(s, f.items)).join('')}</div>`;
  }
  return `
  <div class="view-enter">
    <button class="onb-skip" style="margin-bottom:14px;" onclick="closeArtistUniverse()">← Volver a Discover</button>
    <div class="page-head">
      <div>
        <span class="page-eyebrow">UNIVERSO DE ARTISTA</span>
        <h1 class="page-title">${f.name}</h1>
        <p class="page-sub">Canciones reales de ${f.name}, traídas de su discografía o de una búsqueda real en Spotify — salta de aquí a otra canción y a otra conexión musical.</p>
      </div>
    </div>
    ${body}
  </div>`;
}

/* ---------- MOMENTOS: agrupaciones reales tipo "playlist inteligente" ----
   No son carpetas: nacen solas de tus etiquetas, lugares y personas reales
   (puestas por ti en tus memorias) más tu actividad real en Spotify. Cada
   momento es directamente reproducible como cola.
*/
function buildMoments(){
  const moments = [];
  const byTag = {}, byPlace = {}, byPerson = {};
  MEMORIES.forEach(m=>{
    if(!m.songId) return;
    (m.tags||[]).forEach(t=>{ byTag[t]=byTag[t]||new Set(); byTag[t].add(m.songId); });
    if(m.place && m.place!=='Sin ubicación'){ byPlace[m.place]=byPlace[m.place]||new Set(); byPlace[m.place].add(m.songId); }
    (m.people||[]).forEach(p=>{ if(!p||p.toLowerCase()==='yo') return; byPerson[p]=byPerson[p]||new Set(); byPerson[p].add(m.songId); });
  });
  Object.entries(byTag).forEach(([label,set])=> moments.push({kind:'tag', label, ids:[...set], icon:'sparkle'}));
  Object.entries(byPlace).forEach(([label,set])=> moments.push({kind:'place', label, ids:[...set], icon:'pin'}));
  Object.entries(byPerson).forEach(([label,set])=> moments.push({kind:'person', label, ids:[...set], icon:'users'}));
  const discovering = SONGS.filter(s=>s.source==='spotify' && !s.saved).map(s=>s.id);
  if(discovering.length) moments.push({kind:'discover', label:'Descubrimientos', ids:discovering, icon:'sparkle'});
  const savedReal = SONGS.filter(s=>s.source==='spotify' && s.saved).map(s=>s.id);
  if(savedReal.length) moments.push({kind:'saved', label:'Tu música guardada', ids:savedReal, icon:'save'});
  return moments.filter(m=>m.ids.length>0);
}
function momentCard(m){
  return `
  <div class="moment-card" onclick="playListContext(${JSON.stringify(m.ids)}, '${m.ids[0]}')">
    <div class="moment-icon">${ICONS[m.icon]||ICONS.sparkle}</div>
    <div class="moment-meta"><b>${m.label}</b><span>${m.ids.length} canción${m.ids.length===1?'':'es'}</span></div>
    <button class="mini-btn" title="Reproducir este momento" onclick="event.stopPropagation(); playListContext(${JSON.stringify(m.ids)}, '${m.ids[0]}')">${ICONS.play}</button>
  </div>`;
}

/* ---------- FOTOS DE MEMORIAS: carga real desde tu equipo ----------
   Sin backend, así que la foto se procesa 100% en el navegador con
   FileReader + <canvas> (para redimensionar/comprimir y no reventar el
   límite de tamaño de localStorage) y se guarda como data URL. No hay
   ningún placeholder: lo que ves en la vista previa es exactamente el
   archivo que elegiste, y queda asociado a esa memoria de verdad.
*/
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    if(!file || !file.type || !file.type.startsWith('image/')){ reject(new Error('not-an-image')); return; }
    const reader = new FileReader();
    reader.onerror = ()=> reject(reader.error || new Error('read-failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('decode-failed'));
      img.onload = ()=>{
        let width = img.naturalWidth, height = img.naturalHeight;
        if(width > maxDim || height > maxDim){
          if(width >= height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else { width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function submitMemory(){
  const songSel = document.getElementById('mm-song');
  const song = songSel && songSel.value ? findSong(songSel.value) : null;
  const manualTitle = document.getElementById('mm-title') ? document.getElementById('mm-title').value.trim() : '';
  const manualArtist = document.getElementById('mm-artist') ? document.getElementById('mm-artist').value.trim() : '';
  if(!song && !manualTitle){
    toast('Elige una canción o escribe al menos el título');
    return;
  }
  const dateVal = document.getElementById('mm-date').value;
  const place = document.getElementById('mm-place').value || 'Sin ubicación';
  const people = document.getElementById('mm-people').value.split(',').map(s=>s.trim()).filter(Boolean);
  const note = document.getElementById('mm-note').value || 'Un momento que se quedó pegado a esta canción.';
  const tags = [...document.querySelectorAll('#mm-tags .tag-opt.on')].map(b=>b.dataset.tag);
  const dateLabel = dateVal ? new Date(dateVal+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'}) : 'Sin fecha';
  if(song) song.saved = true;
  const newMem = {
    id:'m'+(MEMORIES.length+1)+'-'+Date.now(),
    songId: song ? song.id : null,
    song: song ? song.title : manualTitle,
    artist: song ? song.artist : (manualArtist || 'Sin vincular todavía'),
    art: song ? song.art : 'art-5',
    date:dateLabel, note, place, people: people.length?people:['Yo'], tags: tags.length?tags:['Nueva memoria'],
    photo: state.modal.photoDataUrl || null
  };
  MEMORIES.unshift(newMem);
  persist();
  closeModal();
  toast('Memoria guardada en tu galaxia');
  state.route = 'archive';
  location.hash = '#/archive';
  render();
}

function finishOnboarding(){
  setTimeout(()=>{
    if(state.ob.name){
      USER.name = state.ob.name;
      USER.handle = '@' + slugify(state.ob.name);
    }
    const firstName = USER.name.split(' ')[0];
    state.chat = [{ role:'ai', text:`¡Hola ${firstName}! Soy tu bibliotecario musical. No reemplazo tu criterio — lo ayudo a conectar. Pregúntame por una época, un ánimo o una persona.`, songs: [] }];

    // del usuario, así que se aplican de verdad a su perfil (antes se pedían
    // y nunca se guardaban en ningún lado — quedaban en una pantalla que no
    // dejaba huella).
    if(state.ob.artists && state.ob.artists.length) USER.favArtists = [...state.ob.artists];
    if(state.ob.eras && state.ob.eras.length) USER.eras = [...state.ob.eras];

    // El "recuerdo musical" del onboarding se guarda como texto real que
    // escribiste — pero en este punto del flujo Spotify aún no está
    // conectado, así que no inventamos una canción "real" con portada de
    // álbum falsa. Se guarda sin songId (sin reproducción) hasta que la
    // vincules a una canción real de verdad, por búsqueda o import.
    const raw = (state.ob.memorySong||'').trim();
    if(raw){
      let title = raw, artist = '';
      if(raw.includes('—')){ const parts = raw.split('—'); title = parts[0].trim(); artist = parts.slice(1).join('—').trim(); }
      else if(raw.includes(' - ')){ const parts = raw.split(' - '); title = parts[0].trim(); artist = parts.slice(1).join(' - ').trim(); }
      MEMORIES.unshift({
        id:'ob-mem-'+Date.now(), songId:null, song:title, artist: artist || 'Sin vincular todavía', art:'art-5',

    state.onboarded = true;
    state.gate = 'app';

    toast(`Tu galaxia está lista, ${firstName} ✨`);
    state.route = 'home';
    location.hash = '#/home';
    render();
  }, 500);

  document.querySelectorAll('.nav-item, .bottom-nav a').forEach(a=>{

/* ---------- BUSCADOR REAL (Spotify Search API) ----------
   Único buscador de la app: busca música real en Spotify (cuando está
   conectado) y sus resultados alimentan la galaxia de verdad — se pueden
   agregar y reproducir, no son solo texto.
*/
let searchDebounceTimer = null;
function onGlobalSearchInput(val){
  const q = (val||'').trim();
  state.search.query = q;
  if(searchDebounceTimer) clearTimeout(searchDebounceTimer);
  if(!q){ state.search.results = []; state.search.error = null; state.search.loading = false; renderSearchPanel(); return; }
  state.search.loading = true;
  renderSearchPanel();
  searchDebounceTimer = setTimeout(()=> runGlobalSearch(q), 350);
}
async function runGlobalSearch(q){
  if(!q){ return; }
  if(!CONNECTIONS.spotify.connected){
    state.search.loading = false;
    state.search.error = 'not-connected';
    state.search.results = [];
    renderSearchPanel();
    return;
  }
  state.search.loading = true;
  state.search.error = null;
  renderSearchPanel();
  try{
    const data = await spFetch('/search', { q, type:'track', limit:10 });
    const tracks = (data.tracks && data.tracks.items) || [];
    state.search.results = tracks.filter(Boolean).map(t=>({
      id:'sp-'+t.id, title:t.name, artist:(t.artists||[]).map(a=>a.name).join(', '), raw:t
    }));
  }catch(e){
    console.error('Spotify search failed', e);
    state.search.error = 'error';
    state.search.results = [];
  }
  state.search.loading = false;
  renderSearchPanel();
}
function closeSearchPanel(){
  const root = document.getElementById('search-panel-root');
  if(root) root.innerHTML = '';
}
function renderSearchPanel(){
  const root = document.getElementById('search-panel-root');
  if(!root) return;
  const s = state.search;
  if(!s.query){ root.innerHTML=''; return; }
  let inner = '';
  if(s.error==='not-connected'){
    inner = `<div class="search-panel-msg">Conecta Spotify para buscar música real. <a href="#/connections" onclick="closeSearchPanel()">Ir a Conexiones</a></div>`;
  } else if(s.loading){
    inner = `<div class="search-panel-msg">Buscando “${s.query}” en Spotify…</div>`;
  } else if(s.error==='error'){
    inner = `<div class="search-panel-msg">No pudimos buscar en Spotify ahora mismo. Intenta de nuevo.</div>`;
  } else if(!s.results.length){
    inner = `<div class="search-panel-msg">Sin resultados reales para “${s.query}”.</div>`;
  } else {
    inner = s.results.map(r=>{
      const inGalaxy = SONGS.some(x=>x.id===r.id && x.saved);
      return `
      <div class="search-result-row">
        <div style="flex:1; min-width:0;"><b>${r.title}</b><div style="font-size:11px; color:var(--mute);">${r.artist}</div></div>
        <button class="mini-btn" onclick="playSearchResult('${r.id}')" title="Reproducir">${ICONS.play}</button>
        <button class="mini-btn ${inGalaxy?'saved':''}" onclick="addSearchResultToGalaxy('${r.id}')" title="${inGalaxy?'Ya está en tu galaxia':'Agregar a tu galaxia'}">${inGalaxy?ICONS.save:ICONS.plus}</button>
      </div>`;
    }).join('');
  }
  root.innerHTML = `<div class="search-panel">${inner}</div>`;
}
function addSearchResultToGalaxy(id){
  const r = state.search.results.find(x=>x.id===id);
  if(!r) return;
  const song = songFromSpotifySearchTrack(r.raw);
  if(!song) return;
  song.saved = true;
  persist();
  toast(`Agregaste “${song.title}” a tu galaxia`);
  renderSearchPanel();
  renderView();
}
function playSearchResult(id){
  const r = state.search.results.find(x=>x.id===id);
  if(!r) return;
  const song = songFromSpotifySearchTrack(r.raw);
  if(!song) return;
  persist();
  playPreview(song);
}
function clearSearch(){
  state.search = { query:'', results:[], loading:false, error:null };
  const input = document.getElementById('global-search');
  if(input) input.value = '';
  closeSearchPanel();
}

async function boot(){
  restore(); // trae la galaxia guardada en este navegador, si existe
  const qs = new URLSearchParams(window.location.search);
  const isOAuthReturn = qs.has('code') || qs.has('error');
  if(isOAuthReturn){
    state.gate = 'connecting';
    render();
    await spotifyHandleCallback();
  }
  state.gate = state.onboarded ? 'app' : (state.gate==='login' || state.gate==='onboarding' ? state.gate : 'landing');
  state.route = (location.hash.replace('#/','') || 'home');
  render();
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
